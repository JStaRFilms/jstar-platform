<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:13px Arial,Helvetica,sans-serif;color:var(--foreground,#183324)}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b5e619;outline-offset:3px}button:disabled{opacity:.25;cursor:default}.options{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.options button{background:transparent;color:inherit;border:1px solid var(--border,#a1afa4);padding:9px 12px;border-radius:5px;font-size:11px}.options button[aria-pressed=true]{background:#b5e619;color:#001514;border-color:#b5e619}.options small{opacity:.6;margin-right:6px}.screen{background:#001514;color:#f3f4e9;border-radius:var(--radius,16px);padding:24px;overflow:hidden;position:relative;isolation:isolate}.head,.foot{display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:9px;letter-spacing:.7px;position:relative;z-index:2}.brand{font-size:17px;font-weight:700;letter-spacing:-1px}.brand small{font-size:8px;font-weight:400;letter-spacing:0;margin-left:6px;color:#b8c5b9}.plain{padding:0;border:0;color:inherit;background:transparent}.head .plain{font-size:10px}.head{padding-bottom:20px}.head .exit{display:flex;align-items:center;gap:10px}.exit b{font-weight:400;font-size:17px}.title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:12px 0 24px}.title h1{font-weight:400;font-size:64px;letter-spacing:-4px;line-height:.95;margin:0}.title em{font:italic 31px Georgia,serif;display:block;letter-spacing:-1px;margin-bottom:9px}.title .count{font:italic 34px Georgia,serif}.stage{background:#000;position:relative;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0}.poster,video{width:100%;height:100%;object-fit:contain;display:block}.poster{position:absolute;inset:0}.bigplay{position:absolute;inset:0;width:54px;height:54px;margin:auto;border:0;border-radius:50%;background:#f3f4e9;color:#001514;font-size:18px;z-index:1}.controls{display:flex;align-items:center;gap:13px;font-size:10px;position:relative;z-index:2;background:#001514;padding:14px 0}.controls button{color:inherit;border:0;background:transparent;padding:3px;font-size:15px;min-width:27px;min-height:27px}.controls .time{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#c2cfbf}.timeline{accent-color:#b5e619;min-width:0;flex:1;height:3px;cursor:pointer;margin:0}.controls .sound{font-size:10px;min-width:41px}.controls .full{font-size:19px}.foot{padding-top:23px;color:#adbbaf}.foot .nav{display:flex;align-items:center;gap:15px}.foot .nav button{font-size:19px;padding:1px 5px;color:#f3f4e9}.foot .name{font-size:10px;color:#f3f4e9}.caption{margin:14px 0 0;font-size:13px}.caption p{margin:5px 0 0;color:var(--muted-foreground,#53685b);font-size:12px;line-height:1.55}.note{font-size:10px;color:var(--muted-foreground,#53685b);margin-top:9px}.playing .bigplay{display:none}.playing .title em{opacity:.65}.stage .playing-note{position:absolute;bottom:20px;font-size:10px;letter-spacing:1px;background:#001514d9;padding:8px 12px;z-index:1}.reveal .stage{animation:reveal .55s cubic-bezier(.16,1,.3,1) both}@keyframes reveal{from{clip-path:inset(48% 0);opacity:.4}to{clip-path:inset(0);opacity:1}}
.edge{background:#000;padding:0}.edge .head{padding:22px 24px;position:absolute;top:0;left:0;right:0;background:#001514b8;z-index:3}.edge .title{position:absolute;top:102px;left:28px;right:28px;z-index:1;pointer-events:none}.edge .title h1{font-size:88px;text-shadow:0 3px 25px #000}.edge .title em{font-size:32px}.edge .stage{aspect-ratio:auto;height:515px}.edge .poster,.edge video{object-fit:contain}.edge .controls{position:absolute;bottom:64px;left:24px;right:24px;padding:12px 16px;background:#001514d9}.edge .foot{padding:18px 24px;background:#001514;position:relative;height:64px}.edge.playing .title{display:none}
.theatre .stage{box-shadow:0 0 0 1px #ffffff14}.theatre .controls{background:transparent}.theatre .title{margin-top:8px}.theatre .title h1{font-size:62px}.theatre .title em{font-size:27px}
.float{background:#061e17}.float .title{margin:5px 0 22px}.float .title h1{font-size:52px}.float .title em{font-size:24px}.float .stage{border-radius:5px}.float .controls{margin:-25px auto 0;width:85%;background:#edf0e3;color:#143323;border-radius:35px;padding:10px 17px;box-shadow:0 10px 30px #0004}.float .controls .time{color:#294932}.float .foot{padding-top:33px}.float .timeline{accent-color:#254a30}
.index .title{margin:0 0 22px}.index .title h1{font-size:52px}.index .title em{font-size:24px}.index .layout{display:grid;grid-template-columns:minmax(0,1fr) 137px;gap:24px}.index .stage{min-height:280px;aspect-ratio:auto}.index .list{display:flex;flex-direction:column;justify-content:center;gap:0}.index .list .kicker{color:#819a88;font-size:8px;letter-spacing:1.4px;margin-bottom:14px}.index .item{border:0;border-bottom:1px solid #ffffff20;background:transparent;text-align:left;color:#899f90;padding:16px 0;font-size:18px;letter-spacing:-.4px}.index .item small{font-size:8px;display:block;letter-spacing:1px;margin-top:6px}.index .item[aria-current=true]{color:#b5e619}.index .foot{padding-top:22px}
.room{background:#e9ebdf;color:#193627}.room .brand small{color:#526e58}.room .title{margin:10px 0 24px}.room .title em{font-size:25px}.room .title h1{font:italic 64px/.95 Georgia,serif;letter-spacing:-3px}.room .stage{box-shadow:0 18px 30px #12372117}.room .controls{background:transparent;color:#193627;border-bottom:1px solid #19362735;padding-bottom:18px}.room .controls .time{color:#526e58}.room .timeline{accent-color:#23452b}.room .foot,.room .foot .nav button,.room .foot .name{color:#193627}.room .bigplay{background:#001514;color:#f3f4e9}
.entry{min-height:505px;position:relative;display:flex;align-items:center}.entry .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.entry:before{content:"";position:absolute;inset:0;background:#00151466;z-index:-1}.entry .copy{padding:25px}.entry h1{font-size:100px;font-weight:400;letter-spacing:-6px;margin:12px 0 25px;line-height:1}.entry em{font:italic 40px Georgia,serif;letter-spacing:-2px}.entry .launch{background:#f3f4e9;color:#001514;border:0;border-radius:50%;width:50px;height:50px;font-size:20px}.entry span{font-size:9px;letter-spacing:1px;margin-left:14px}.preview .head{position:absolute;left:24px;right:24px;top:24px}.preview{padding:0}.preview .foot{padding:20px 24px;background:#001514}
@media(max-width:520px){.screen{padding:18px}.brand small{display:none}.title h1{font-size:49px!important;letter-spacing:-2.8px}.title em{font-size:25px!important}.title .count{font-size:27px}.controls{gap:6px}.controls .time{font-size:9px}.controls .sound{min-width:32px;font-size:9px}.controls button{min-width:24px}.edge{padding:0}.edge .stage{height:500px}.edge .title{left:20px;right:20px;top:120px}.edge .title h1{font-size:75px!important}.edge .controls{left:14px;right:14px;padding:10px}.edge .head{padding:22px 20px}.edge .foot{padding:18px 20px}.theatre .stage{min-height:220px;aspect-ratio:auto}.theatre .title{margin:10px 0 28px}.theatre .foot{padding-top:25px}.float .stage{height:275px;aspect-ratio:auto}.float .controls{width:95%;padding:9px 11px;margin-top:-23px}.float .controls .sound{display:none}.index .layout{grid-template-columns:1fr;gap:12px}.index .stage{min-height:235px}.index .list{flex-direction:row;gap:22px;align-items:center}.index .list .kicker{margin:0;font-size:8px;max-width:65px;line-height:1.7}.index .item{font-size:17px;padding:12px 0}.index .controls{padding-bottom:0}.room .stage{min-height:228px;aspect-ratio:auto}.room .title{margin:14px 0 28px}.foot{font-size:8px}.foot .nav{gap:8px}.preview{padding:0}.entry h1{font-size:82px}.entry em{font-size:35px}.entry .copy{padding:20px}.options button{padding:8px 9px;font-size:10px}}
@media(prefers-reduced-motion:reduce){.reveal .stage{animation:none}*{transition:none!important}}
</style></head><body><nav class="options" aria-label="Playback layouts"><button data-layout="edge"><small>01</small>Edge to edge</button><button data-layout="theatre"><small>02</small>The theatre</button><button data-layout="float"><small>03</small>Floating controls</button><button data-layout="index"><small>04</small>Film + index</button><button data-layout="room"><small>05</small>The quiet room</button></nav><main id="mount"></main><div id="caption" class="caption"></div><p class="note">Inline review uses stills. The local HTML plays the supplied videos.</p>
<script>
const films=[{id:'nifemi',name:'Nifemi',label:'Full film',poster:'../../../public/redesign/nifemi-poster.jpg',src:'../../../public/redesign/nifemi.mp4'},{id:'sharon',name:'Sharon',label:'Excerpt',poster:'../../../public/redesign/gallery-sharon.jpg',src:'../../../public/redesign/gallery-sharon.mp4'}];
const descriptions={edge:['01 / Edge to edge','The preview gives way to the film. Titles disappear on play; controls sit over the picture.'],theatre:['02 / The theatre','A deliberate black stage. The film stays uncropped, with playback controls underneath.'],float:['03 / Floating controls','A clean picture with one compact control bar. Navigation stays outside the player.'],index:['04 / Film + index','Keep the filtered film list visible beside the player. Switch pieces without leaving the viewing space.'],room:['05 / The quiet room','A pale projection room, a dark screen and serif titles. A quieter contrast to the green gallery.']};
let layout='edge',index=0,playing=false,inPreview=false;
const mount=document.getElementById('mount');
const header=()=>'<header class="head"><span class="brand">J StaR<small>Films Studios</small></span><button class="plain exit" data-back aria-label="Back to cinema preview"><span>Back to preview</span><b>×</b></button></header>';
const nav=()=>'<footer class="foot"><span>FILM / 0'+(index+1)+' OF 02</span><div class="nav"><button class="plain" data-prev '+(index===0?'disabled':'')+' aria-label="Previous film">←</button><span class="name">'+films[index].name+'</span><button class="plain" data-next '+(index===films.length-1?'disabled':'')+' aria-label="Next film">→</button></div></footer>';
const controls=()=>'<div class="controls"><button data-play aria-label="Play film">▶</button><span class="time">--:--</span><input class="timeline" aria-label="Seek video" type="range" min="0" max="100" value="0" disabled><button class="sound" data-mute aria-label="Mute video">Sound</button><button class="full" data-full aria-label="Fullscreen">⛶</button></div>';
const stage=()=>'<div class="stage" data-stage><img class="poster" src="'+films[index].poster+'" alt="'+films[index].name+' film still"><button class="bigplay" data-play aria-label="Play '+films[index].name+'">▶</button></div>';
function render(){mount.querySelector('video')?.pause();playing=false;inPreview=false;const p=films[index];mount.innerHTML='<section class="screen '+layout+' reveal">'+header()+'<div class="title"><h1><em>Now showing</em>'+p.name+'.</h1><span class="count">0'+(index+1)+'</span></div>'+(layout==='index'?'<div class="layout"><div>'+stage()+controls()+'</div><nav class="list" aria-label="Current film selection"><span class="kicker">FILM / 02 PROJECTS</span>'+films.map((x,i)=>'<button class="item" data-film="'+i+'" aria-current="'+(index===i)+'">'+x.name+'<small>'+x.label+'</small></button>').join('')+'</nav></div>':stage()+controls())+nav()+'</section>';document.getElementById('caption').innerHTML='<strong>'+descriptions[layout][0]+'</strong><p>'+descriptions[layout][1]+'</p>';document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));}
function update(){const v=mount.querySelector('video');playing=!!v&&!v.paused;updatePlayState();}
function updatePlayState(){mount.querySelector('.screen')?.classList.toggle('playing',playing);mount.querySelectorAll('[data-play]').forEach(b=>{b.textContent=playing?'Ⅱ':'▶';b.setAttribute('aria-label',playing?'Pause film':'Play film');});}
function time(n){return Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'--:--';}
function preview(){mount.querySelector('video')?.pause();playing=false;inPreview=true;const p=films[index];mount.innerHTML='<section class="screen preview">'+header()+'<div class="entry"><img class="photo" src="'+p.poster+'" alt="'+p.name+' preview still"><div class="copy"><em>Selected work</em><h1>'+p.name+'.</h1><button class="launch" data-launch aria-label="Watch '+p.name+'">↗</button><span>'+p.label.toUpperCase()+'</span></div></div>'+nav()+'</section>';mount.querySelector('[data-back] span').textContent='Cinema preview';}
async function play(){if(window.__INLINE_REVIEW__){playing=!playing;updatePlayState();if(playing&&!mount.querySelector('.playing-note'))mount.querySelector('.stage').insertAdjacentHTML('beforeend','<span class="playing-note">PLAYBACK LAYOUT PREVIEW</span>');else if(!playing)mount.querySelector('.playing-note')?.remove();return;}let v=mount.querySelector('video');if(!v){v=document.createElement('video');v.controls=false;v.playsInline=true;v.preload='none';v.src=films[index].src;v.poster=films[index].poster;v.setAttribute('aria-label',films[index].name+' '+films[index].label);mount.querySelector('.poster').replaceWith(v);v.addEventListener('play',update);v.addEventListener('pause',update);v.addEventListener('ended',update);v.addEventListener('timeupdate',()=>{if(!v.isConnected)return;mount.querySelector('.time').textContent=time(v.currentTime)+' / '+time(v.duration);const range=mount.querySelector('.timeline');if(Number.isFinite(v.duration)&&v.duration>0){range.disabled=false;range.value=v.currentTime/v.duration*100;}});v.addEventListener('error',()=>{if(!v.isConnected)return;mount.querySelector('.stage').innerHTML='<p style="padding:24px;font-size:12px">Video unavailable. Return to the preview and try again.</p>';});}if(v.paused)await v.play().catch(()=>{});else v.pause();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.layout){layout=b.dataset.layout;render();return}if(b.hasAttribute('data-back')){preview();return}if(b.hasAttribute('data-launch')){render();void play();return}if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')||b.dataset.film!==undefined){index=b.dataset.film!==undefined?Number(b.dataset.film):Math.max(0,Math.min(films.length-1,index+(b.hasAttribute('data-next')?1:-1)));const wasPreview=inPreview;wasPreview?preview():render();return}if(b.hasAttribute('data-play')){void play();return}if(b.hasAttribute('data-mute')){const v=mount.querySelector('video');if(v){v.muted=!v.muted;b.textContent=v.muted?'Muted':'Sound';}else{b.textContent=b.textContent==='Sound'?'Muted':'Sound';}return}if(b.hasAttribute('data-full'))mount.querySelector('[data-stage]')?.requestFullscreen?.().catch(()=>{});});
document.addEventListener('input',e=>{if(e.target.matches('.timeline')){const v=mount.querySelector('video');if(v&&Number.isFinite(v.duration))v.currentTime=e.target.value/100*v.duration;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){preview();}if(e.target instanceof HTMLInputElement||e.target instanceof HTMLButtonElement)return;if(e.key==='ArrowRight'&&index<films.length-1){index++;render();}if(e.key==='ArrowLeft'&&index>0){index--;render();}});
render();console.log('Five film playback layouts. Film filter only. No gallery replacement.');
</script></body></html>
