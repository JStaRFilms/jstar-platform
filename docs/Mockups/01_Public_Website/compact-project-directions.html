<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#183324);font:13px Arial,Helvetica,sans-serif}button,a,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.35}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #b5e619;outline-offset:4px}h1,h2,h3,p{margin:0}button{color:inherit}.options{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.options button{background:transparent;border:1px solid var(--border,#a1afa4);border-radius:5px;padding:9px 12px;font-size:11px}.options small{opacity:.6;margin-right:6px}.options button[aria-pressed=true]{background:#b5e619;color:#001514;border-color:#b5e619}.screen{--green:#001514;--lime:#b5e619;background:var(--green);color:#f3f4e9;border-radius:var(--radius,16px);padding:24px;overflow:hidden;position:relative;isolation:isolate}.head{height:26px;display:flex;justify-content:space-between;align-items:center;font-size:10px;position:relative;z-index:5}.brand{font-size:17px;font-weight:700;letter-spacing:-1px;opacity:0;transition:opacity .2s}.brand small{font-size:8px;font-weight:400;letter-spacing:0;margin-left:6px}.screen:hover .brand,.screen:focus-within .brand{opacity:1}.plain{background:none;border:0;padding:0;cursor:pointer}.head .plain{font-size:10px;display:flex;align-items:center;gap:10px}.head .plain span{font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(0,1fr);gap:28px;padding-top:25px;min-height:477px;align-items:center}.cinema{position:relative;min-width:0;padding-bottom:18px}.filmhead{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 21px}.filmhead em{font:italic 25px Georgia,serif;letter-spacing:-1px}.filmhead h1{font-weight:400;font-size:60px;line-height:1;letter-spacing:-3.8px;margin:7px 0 0}.count{font:italic 30px Georgia,serif;align-self:flex-start;margin-top:-7px;color:#b5e619}.picture{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.picture img,.picture video{width:100%;height:100%;object-fit:contain;display:block}.picture img{position:absolute;inset:0}.play{position:absolute;inset:0;width:46px;height:46px;margin:auto;border:0;background:#edf0e3;color:#173326;border-radius:50%;font-size:17px}.playing .picture>.play{display:none}.controlbar{display:flex;align-items:center;gap:9px;width:92%;margin:-19px auto 0;padding:8px 13px;border-radius:30px;background:#edf0e3;color:#173326;position:relative;z-index:2;box-shadow:0 12px 30px #0003}.controlbar button{border:0;background:transparent;padding:3px;font-size:13px;min-width:23px;min-height:25px}.controlbar .sound{font-size:9px}.controlbar .time{font-size:9px;white-space:nowrap;font-variant-numeric:tabular-nums}.seek{height:3px;flex:1;min-width:0;accent-color:#23442b;margin:0}.mediafoot{display:flex;justify-content:space-between;align-items:center;margin-top:23px;font-size:9px;letter-spacing:.5px;color:#a3b7a8}.mode{font-size:10px;color:#f3f4e9}.information{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-width:0;padding-top:9px}.kicker{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#9eb09e}.information h2{font-size:33px;line-height:1.03;font-weight:400;letter-spacing:-1.5px;margin:13px 0 17px}.information p{font-size:12px;line-height:1.75;color:#b9c7b6}.information .small-label{font-size:8px;text-transform:uppercase;letter-spacing:1.2px;color:#829b85;margin-bottom:9px}.information .brief{border-top:1px solid #ffffff23;padding-top:16px;margin-top:22px}.information h3{font-size:13px;font-weight:400;margin-bottom:8px}.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:19px}.social button{font-size:9px;padding:0 0 5px;border:0;border-bottom:1px solid #829b8566;background:transparent;color:inherit;opacity:.65}.information .credit{margin-top:23px;font-size:9px;color:#9daf9e}.foot{border-top:1px solid #ffffff1c;margin-top:23px;padding-top:17px;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.5px;color:#96aa98}.foot .arrows{display:flex;align-items:center;gap:15px}.foot .arrows button{font-size:20px;background:none;border:0;color:#f3f4e9;padding:0 3px}.foot .arrows span{font-size:10px;color:#f3f4e9}.note{font-size:10px;color:var(--muted-foreground,#53685b);line-height:1.6;margin-top:10px}.caption{margin-top:14px;font-size:13px}.caption p{margin-top:5px;font-size:12px;color:var(--muted-foreground,#53685b);line-height:1.6}.screen.expanded .layout{grid-template-columns:minmax(0,1fr)}.screen.expanded .information{display:none}.screen.expanded .picture{aspect-ratio:auto;height:370px}.screen.expanded .filmhead{position:absolute;left:22px;right:22px;top:23px;z-index:1;pointer-events:none;text-shadow:0 3px 25px #000}.screen.expanded .filmhead h1{font-size:77px}.screen.expanded .controlbar{width:min(80%,460px)}.screen.expanded .cinema{padding:0}.screen.expanded .mediafoot{padding:0 6px}.screen.expanded .playing .filmhead{opacity:0}
.paper .layout{gap:24px;grid-template-columns:minmax(0,1.52fr) minmax(0,1fr)}.paper .information{background:#e7e9db;color:#173926;padding:27px 22px;align-self:center;min-height:424px;box-shadow:4px 5px 0 #b5e619}.paper .information .kicker,.paper .information .small-label{color:#57725b}.paper .information h2{font:italic 39px/1.05 Georgia,serif;letter-spacing:-1.8px}.paper .information p{color:#40583d}.paper .information .brief{border-color:#17392633}.paper .information .credit{color:#57725b}.paper .social button{border-color:#17392655}
.tabs .information{padding-left:22px;border-left:1px solid #ffffff25}.tabbar{display:flex;gap:15px;border-bottom:1px solid #ffffff25;margin:17px 0 26px}.tabbar button{font-size:10px;background:none;border:0;padding:0 0 11px;color:#8da58e}.tabbar button[aria-selected=true]{color:#b5e619;border-bottom:1px solid #b5e619}.tabs .tab-content{min-height:195px}.tabs .information h2{font:italic 37px/1.07 Georgia,serif;letter-spacing:-1.5px}.tabs .social{margin-top:auto;padding-top:25px}.tabs .number{font-size:74px;font-weight:400;letter-spacing:-6px;line-height:1;color:#b5e619;margin-bottom:25px}
.chapters .information{padding-left:20px}.chapters .information h2{font-size:37px;letter-spacing:-1.8px}.chapters details{border-bottom:1px solid #ffffff25}.chapters summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;padding:15px 0;font-size:12px}.chapters summary::-webkit-details-marker{display:none}.chapters summary span{font-size:9px;color:#7e9a82;margin-right:8px}.chapters summary:after{content:'+';font-size:16px;color:#b5e619}.chapters details[open] summary:after{content:'−'}.chapters details p{padding:0 0 15px;font-size:11px}.chapters .social{margin-top:24px}
.note-layout{background:#091b16}.note-layout .layout{gap:27px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.note-layout .cinema{transform:rotate(-1.5deg);transition:transform .4s}.note-layout.expanded .cinema{transform:none}.note-layout .information{padding:28px 23px;border:1px solid #9ab19350;position:relative;align-self:center;background:#182b22;min-height:370px}.note-layout .information:before{content:'';position:absolute;top:-8px;left:25px;width:35px;height:15px;background:#b5e619;transform:rotate(-6deg)}.note-layout .information h2{font:italic 39px/1.04 Georgia,serif;letter-spacing:-1.6px}.note-layout .information .credit{border-top:1px solid #ffffff25;padding-top:17px;margin-top:24px}.note-layout .social{margin-top:22px}.wipe .picture{animation:shutter .5s cubic-bezier(.16,1,.3,1) both}@keyframes shutter{from{clip-path:inset(48% 0)}to{clip-path:inset(0)}}.viewmsg{position:absolute;bottom:12px;left:12px;font-size:8px;letter-spacing:1px;background:#001514d9;padding:5px 8px}
@media(max-width:540px){.screen{padding:18px}.brand small{display:none}.brand{opacity:1}.layout,.paper .layout,.note-layout .layout{grid-template-columns:1fr;gap:25px;min-height:0;padding-top:23px}.filmhead h1{font-size:56px}.picture{min-height:206px;aspect-ratio:16/9}.cinema{padding-bottom:0}.controlbar{width:94%;gap:7px;padding:8px 11px}.controlbar .sound{font-size:8px;padding:0}.information{padding-top:7px}.information h2{font-size:36px}.information p{max-width:450px}.information .brief{margin-top:18px}.paper .information{min-height:0;padding:25px}.tabs .information{border-left:0;border-top:1px solid #ffffff25;padding:22px 0 0}.tabs .tab-content{min-height:170px}.tabs .social{padding-top:0}.chapters .information{padding-left:0;border-top:1px solid #ffffff25;padding-top:23px}.note-layout .cinema{transform:none}.note-layout .information{min-height:0;padding:25px}.screen.expanded .picture{height:415px}.screen.expanded .filmhead{left:16px;right:16px}.screen.expanded .filmhead h1{font-size:64px}.screen.expanded .controlbar{width:94%}.foot{margin-top:25px}.options button{padding:8px 9px;font-size:10px}}
@media(hover:none){.brand{opacity:1}}@media(prefers-reduced-motion:reduce){.wipe .picture{animation:none}*{transition:none!important}}
</style></head><body>
<nav class="options" aria-label="Compact view directions"><button data-option="rail"><small>01</small>Quiet rail</button><button data-option="paper"><small>02</small>The dossier</button><button data-option="tabs"><small>03</small>One thought at a time</button><button data-option="chapters"><small>04</small>Chapters</button><button data-option="note-layout"><small>05</small>Studio note</button></nav>
<main id="mount"></main><div id="caption" class="caption"></div><p class="note">Copy is a layout sample, not an approved project brief. Social buttons are examples, not verified posts. Inline uses stills; local HTML plays the supplied films.</p>
<script>
const films=[{id:'nifemi',name:'Nifemi',kind:'Full film',poster:'../../../public/redesign/nifemi-poster.jpg',src:'../../../public/redesign/nifemi.mp4'},{id:'sharon',name:'Sharon',kind:'Excerpt',poster:'../../../public/redesign/gallery-sharon.jpg',src:'../../../public/redesign/gallery-sharon.mp4'}];
const descriptions={rail:['01 / Quiet rail','One short story, the brief and a few links. Film stays dominant.'],paper:['02 / The dossier','A pale editorial panel beside the dark cinema. More contrast, a clear place for the project story.'],tabs:['03 / One thought at a time','Story, brief and credits share one space. No long scroll or wall of text.'],chapters:['04 / Chapters','Keep the information closed until someone asks for it. Each section opens independently.'],'note-layout':['05 / Studio note','A small note beside the film, with a looser, personal studio feel.']};
let option='rail',index=0,activeTab='story',demoPlaying=false;const mount=document.getElementById('mount');
const story='A moment, seen differently.';
const shortCopy='A short introduction to the people, occasion and idea behind the film.';
const briefCopy='What the piece needed to say, and how it should feel.';
const creditsCopy='The people behind the camera, the edit and the final piece.';
function social(){return '<div class="social" aria-label="Example published links"><button disabled>YouTube ↗</button><button disabled>TikTok ↗</button><button disabled>Instagram ↗</button></div>';}
function information(){if(option==='tabs')return '<div class="kicker">Behind the film</div><div class="tabbar" role="tablist" aria-label="Project information">'+['story','brief','credits'].map(t=>'<button id="tab-'+t+'" data-tab="'+t+'" role="tab" aria-controls="tab-content" aria-selected="'+(t===activeTab)+'" tabindex="'+(t===activeTab?0:-1)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><div class="tab-content" id="tab-content" role="tabpanel" aria-labelledby="tab-'+activeTab+'">'+tabContent()+'</div>'+social();if(option==='chapters')return '<span class="kicker">Behind the film</span><h2>'+films[index].name+'.</h2>'+[['The story',shortCopy],['The brief',briefCopy],['Credits',creditsCopy]].map((s,i)=>'<details '+(i===0?'open':'')+'><summary><div><span>0'+(i+1)+'</span>'+s[0]+'</div></summary><p>'+s[1]+'</p></details>').join('')+social();return '<span class="kicker">'+(option==='paper'?'Project notes':option==='note-layout'?'A note from the studio':'Behind the film')+'</span><h2>'+story+'</h2><p>'+shortCopy+'</p><div class="brief"><div class="small-label">The brief</div><p>'+briefCopy+'</p></div>'+social()+'<div class="credit">'+(option==='note-layout'?'J StaR Films Studios':'Credits and roles to be confirmed.')+'</div>';}
function tabContent(){return activeTab==='story'?'<h2>'+story+'</h2><p>'+shortCopy+'</p>':activeTab==='brief'?'<h2>The original<br>idea.</h2><p>'+briefCopy+'</p>':'<h2>Behind the<br>camera.</h2><p>'+creditsCopy+'</p>';}
function destroy(){const v=mount.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load();}}
function render(){destroy();demoPlaying=false;const p=films[index];mount.innerHTML='<section class="screen '+option+' wipe"><header class="head"><span class="brand">J StaR<small>Films Studios</small></span><button class="plain" data-mode aria-label="Switch to cinema view">Cinema view <span>↗</span></button></header><div class="layout"><div class="cinema"><div class="filmhead"><div><em>Now showing</em><h1>'+p.name+'.</h1></div><span class="count">0'+(index+1)+'</span></div><div class="picture"><img src="'+p.poster+'" alt="'+p.name+' film still"><button class="play" data-play aria-label="Play '+p.name+'">▶</button></div><div class="controlbar"><button data-play aria-label="Play film">▶</button><span class="time">--:--</span><input class="seek" aria-label="Seek video" type="range" value="0" min="0" max="100" disabled><button class="sound" data-mute aria-label="Mute video">Sound</button><button data-full aria-label="Fullscreen">⛶</button></div><div class="mediafoot"><span>'+p.kind.toUpperCase()+'</span><button class="plain mode" data-mode>Expand ↗</button></div></div><aside class="information" aria-label="Project information">'+information()+'</aside></div><footer class="foot"><span>FILM / 0'+(index+1)+' OF 02</span><div class="arrows"><button data-prev '+(index===0?'disabled':'')+' aria-label="Previous project">←</button><span>'+p.name+'</span><button data-next '+(index===1?'disabled':'')+' aria-label="Next project">→</button></div></footer></section>';document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===option)));document.getElementById('caption').innerHTML='<strong>'+descriptions[option][0]+'</strong><p>'+descriptions[option][1]+'</p>';}
function setPlaying(value){mount.querySelector('.cinema')?.classList.toggle('playing',value);mount.querySelectorAll('[data-play]').forEach(b=>{b.textContent=value?'Ⅱ':'▶';b.setAttribute('aria-label',value?'Pause film':'Play film');});}
function time(t){return Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'--:--';}
async function play(){if(window.__INLINE_REVIEW__){demoPlaying=!demoPlaying;setPlaying(demoPlaying);if(demoPlaying&&!mount.querySelector('.viewmsg'))mount.querySelector('.picture').insertAdjacentHTML('beforeend','<span class="viewmsg">PLAYBACK LAYOUT PREVIEW</span>');if(!demoPlaying)mount.querySelector('.viewmsg')?.remove();return;}let v=mount.querySelector('video');if(!v){v=document.createElement('video');v.src=films[index].src;v.poster=films[index].poster;v.playsInline=true;v.preload='none';v.setAttribute('aria-label',films[index].name+' '+films[index].kind);mount.querySelector('.picture img').replaceWith(v);for(const event of ['play','pause','ended'])v.addEventListener(event,()=>{if(v.isConnected)setPlaying(!v.paused);});v.addEventListener('timeupdate',()=>{if(!v.isConnected)return;mount.querySelector('.time').textContent=time(v.currentTime)+' / '+time(v.duration);const r=mount.querySelector('.seek');if(Number.isFinite(v.duration)&&v.duration>0){r.disabled=false;r.value=v.currentTime/v.duration*100;}});v.addEventListener('error',()=>{if(!v.isConnected)return;mount.querySelector('.picture').innerHTML='<p style="padding:20px;font-size:12px">Video unavailable. Switch project and try again.</p>';});}if(v.paused)await v.play().catch(()=>{});else v.pause();}
function selectTab(t,focus=false){activeTab=t;mount.querySelectorAll('[data-tab]').forEach(b=>{const yes=b.dataset.tab===t;b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1;if(yes&&focus)b.focus();});const panel=mount.querySelector('#tab-content');panel.setAttribute('aria-labelledby','tab-'+t);panel.innerHTML=tabContent();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.option){option=b.dataset.option;render();return;}if(b.hasAttribute('data-mode')){const s=mount.querySelector('.screen');const expanded=s.classList.toggle('expanded');s.querySelector('.information').inert=expanded;mount.querySelectorAll('[data-mode]').forEach(x=>{x.setAttribute('aria-label',expanded?'Switch to compact view':'Switch to cinema view');x.innerHTML=x.closest('.head')?(expanded?'Project info <span>↙</span>':'Cinema view <span>↗</span>'):(expanded?'Project info ↙':'Expand ↗');});return;}if(b.hasAttribute('data-next')||b.hasAttribute('data-prev')){index+=b.hasAttribute('data-next')?1:-1;const expanded=mount.querySelector('.screen').classList.contains('expanded');render();if(expanded)mount.querySelector('[data-mode]').click();return;}if(b.dataset.tab){selectTab(b.dataset.tab);return;}if(b.hasAttribute('data-play')){void play();return;}if(b.hasAttribute('data-mute')){const v=mount.querySelector('video');if(v){v.muted=!v.muted;b.textContent=v.muted?'Muted':'Sound';}else b.textContent=b.textContent==='Sound'?'Muted':'Sound';return;}if(b.hasAttribute('data-full')){const v=mount.querySelector('video');if(v){v.controls=true;v.requestFullscreen?.().catch(()=>{});}else mount.querySelector('.picture').requestFullscreen?.().catch(()=>{});}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){const v=mount.querySelector('video');if(v)v.controls=false;}});
document.addEventListener('input',e=>{if(e.target.matches('.seek')){const v=mount.querySelector('video');if(v&&Number.isFinite(v.duration))v.currentTime=e.target.value/100*v.duration;}});
document.addEventListener('keydown',e=>{const b=e.target.closest('[data-tab]');if(b&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['story','brief','credits'];const next=e.key==='Home'?'story':e.key==='End'?'credits':tabs[(tabs.indexOf(activeTab)+(e.key==='ArrowRight'?1:2))%3];selectTab(next,true);}if(e.key==='Escape'&&mount.querySelector('.screen')?.classList.contains('expanded'))mount.querySelector('[data-mode]').click();});
render();console.log('Five compact project views. Existing gallery untouched. Project copy is a design sample.');
</script></body></html>
