</style></head><body>
<main id="mount"></main><p class="note">Screens use the existing product image and two detail crops. The sample is fixed. Try app needs the real live-product URL; Source is the confirmed GitHub repository.</p>
<script>
const screenshot='../../../public/portfolio/thumbnails/adaptive-study-game.png';
const portrait='../../../public/team/john-oluleke-oke.jpg';
const sourceHref='https://github.com/JStaRFilms/Adaptive-Study-Game';
const projects=[{title:'Adaptive Study Game',short:'Study Game',type:'Interactive learning'},{title:'School management system',short:'School management',type:'Business software'}];

let index=0,showSample=false,step=0,answer='',detail=null,returnFocus=null;
const mount=document.getElementById('mount');
function quiz(){return '<div class="quiz"><span class="micro">Fixed sample / 01 question</span><h3>Which planet is known as the red planet?</h3><div class="answers">'+['Venus','Mars'].map(x=>'<button data-answer="'+x+'" aria-pressed="'+(answer===x)+'">'+x+'</button>').join('')+'</div><p class="feedback" role="status">'+(answer?(answer==='Mars'?'Correct. Mars gets its red colour from iron oxide.':'Try again. Look for the planet with iron oxide on its surface.'):'')+'</p></div>';}
function media(){if(index===1)return '<div class="missing"><div><h3>The actual product<br>belongs here.</h3><p>Screenshot, demo and public destination<br>have not been supplied.</p></div></div>';return '<div class="segment" role="group" aria-label="Product presentation"><button data-view="screen" aria-pressed="'+!showSample+'">Screenshots</button><button data-view="sample" aria-pressed="'+showSample+'">Try sample</button></div><div class="window"><div class="screen-pane" '+(showSample?'hidden inert':'')+'><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span>Adaptive Study Game / interface</span><span>↗</span></div><div class="display" data-step="'+step+'"><img src="'+screenshot+'" alt="Adaptive Study Game interface screenshot"></div></div><div class="sample-pane" '+(!showSample?'hidden inert':'')+'>'+quiz()+'</div></div><nav class="thumbs" aria-label="Screenshot frames" '+(showSample?'hidden':'')+'>'+['Overview','Review','New set'].map((label,i)=>'<button data-step="'+i+'" aria-pressed="'+(step===i)+'"><span class="thumb-picture"><img src="'+screenshot+'" alt="" class="crop-'+i+'"></span><span><small>0'+(i+1)+'</small> '+label+'</span></button>').join('')+'</nav><div class="toolbelt"><button data-try>Try sample</button><span class="separator"></span><button disabled title="Live app URL still needed">Try app ↗</button><span class="separator"></span><a href="'+sourceHref+'" target="_blank" rel="noopener noreferrer">Source ↗</a><span class="separator"></span><button class="full" data-full aria-label="Expand active product view" aria-pressed="false">⛶</button></div>';}
function notes(){return '<div class="notes-heading"><span class="kicker">Studio Notes</span><h2>'+(index===0?'Turn notes<br>into practice.':'School<br>management.')+'</h2><p>'+(index===0?'A browser-based study tool built around active learning.':'The project name and product description need confirmation.')+'</p></div><section class="brief"><h3>The brief</h3><p class="clamp">'+(index===0?'Studying from static notes can be passive. The aim was to turn those materials into active, personalised practice.':'Who uses the system, what they need to do and what was delivered.')+'</p><button class="plain readmore" data-read>Read more ↗</button></section><div class="technology">'+(index===0?'<span>React</span><span>TypeScript</span><span>Gemini</span>':'<span>Project details pending</span>')+'</div><section class="creditfoot"><div class="by">With</div>'+(index===0?'<button class="person" data-person><img src="'+portrait+'" alt=""><span><strong>John Oluleke-Oke</strong><small>Architect & full-stack developer</small></span><span class="arrow">↗</span></button>':'<p>Contributors to confirm.</p>')+'</section>';}
function render(){const screen=mount.querySelector('.screen'),zoomed=screen?.classList.contains('zoomed')||false;const markup='<section class="screen refined'+(zoomed?' zoomed':'')+'"><div class="core"><header class="head"><span class="brand">J StaR<small>Films Studios</small></span><span class="label">Selected work</span></header><div class="layout"><div class="product"><div class="producthead"><div><em>In use</em><h1>'+projects[index].short+'.</h1></div><span class="count">0'+(index+1)+'</span></div><div id="media">'+media()+'</div></div><aside class="information" aria-label="Studio Notes">'+notes()+'</aside></div><footer class="foot"><span>SOFTWARE / 0'+(index+1)+' OF 02</span><div class="arrows"><button data-prev '+(index===0?'disabled':'')+' aria-label="Previous software project">←</button><span>'+projects[index].short+'</span><button data-next '+(index===1?'disabled':'')+' aria-label="Next software project">→</button></div></footer></div><div class="layer" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"></section></div></section>';if(!screen)mount.innerHTML=markup;else{const temp=document.createElement('div');temp.innerHTML=markup;screen.querySelector('.core').replaceWith(temp.querySelector('.core'));screen.className='screen refined'+(zoomed?' zoomed':'');}syncZoom();}
function openDetail(profile=false){detail=profile?'profile':'brief';returnFocus=document.activeElement;const s=mount.querySelector('.screen'),r=s.querySelector('.information').getBoundingClientRect(),base=s.getBoundingClientRect(),left=innerWidth<=700?0:r.left-base.left;const d=s.querySelector('.drawer');Object.assign(d.style,{left:left+'px',top:'0px',width:base.width-left+'px',height:base.height+'px'});d.innerHTML='<header class="drawer-head"><span>'+projects[index].short.toUpperCase()+' / '+(profile?'CONTRIBUTOR':'STUDIO NOTES')+'</span><button data-close aria-label="Close detail">×</button></header>'+(profile?'<img src="'+portrait+'" alt="John Oluleke-Oke"><div class="role">Lead architect & full-stack developer</div><h2 id="detail-title">John<br>Oluleke-Oke.</h2><p>Role drawn from the existing project record. Personal social links still need approval.</p>':index===0?'<span class="kicker">From the existing project record</span><h2 id="detail-title">Turn notes<br>into practice.</h2><h3>The problem</h3><p>Studying from static notes can be passive. The project aimed to turn those materials into active practice.</p><h3>The approach</h3><p>The existing record describes a browser application that uses PDFs, documents and YouTube URLs to create a visual reading canvas and AI-generated quizzes.</p><h3>The build</h3><p>React, TypeScript, Gemini and local-first browser storage. The record describes parallel generation pipelines to reduce latency.</p><h3>The sample on this site</h3><p>The gallery demonstration is a fixed quiz. It does not generate questions or call Gemini.</p>':'<h2 id="detail-title">Project details<br>to supply.</h2><p>Confirm the product name, original brief, screenshots, collaborators and any public destination.</p>');s.classList.add('detail-open');s.querySelector('.layer').hidden=false;s.querySelector('.core').inert=true;d.querySelector('[data-close]').focus({preventScroll:true});}
function closeDetail(){detail=null;mount.querySelector('.screen').classList.remove('detail-open');mount.querySelector('.layer').hidden=true;mount.querySelector('.core').inert=false;returnFocus?.isConnected&&returnFocus.focus({preventScroll:true});}
document.addEventListener('click',async e=>{if(e.target===mount.querySelector('.layer')){closeDetail();return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){index+=b.hasAttribute('data-next')?1:-1;render();return;}if(b.hasAttribute('data-close')){closeDetail();return;}if(b.hasAttribute('data-read')){openDetail();return;}if(b.hasAttribute('data-person')){openDetail(true);return;}if(b.hasAttribute('data-try')){switchPresentation(true);return;}if(b.dataset.view){switchPresentation(b.dataset.view==='sample');return;}if(b.dataset.answer){answer=b.dataset.answer;mount.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.answer===answer)));mount.querySelector('.feedback').textContent=answer==='Mars'?'Correct. Mars gets its red colour from iron oxide.':'Try again. Look for the planet with iron oxide on its surface.';return;}if(b.dataset.step!==undefined){step=Number(b.dataset.step);mount.querySelector('.display').dataset.step=step;mount.querySelectorAll('button[data-step]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.step)===step)));return;}if(b.hasAttribute('data-full')){const s=mount.querySelector('.screen');zoomFrom=s.querySelector('.window').getBoundingClientRect();if(s.classList.contains('zoomed')){if(document.fullscreenElement)await document.exitFullscreen();s.classList.remove('preview-zoom');syncZoom();return;}if(!window.__INLINE_REVIEW__){try{await s.requestFullscreen();}catch{s.classList.add('preview-zoom');}}else s.classList.add('preview-zoom');syncZoom();}});
document.addEventListener('fullscreenchange',syncZoom);
document.addEventListener('keydown',e=>{if(detail){if(e.key==='Escape'){e.preventDefault();closeDetail();}if(e.key==='Tab'){const close=mount.querySelector('[data-close]');e.preventDefault();close.focus();}return;}if(e.key==='Escape'){mount.querySelector('.screen')?.classList.remove('preview-zoom');syncZoom();}});

let zoomFrom=null,zoomAnimation=null;
function switchPresentation(sample){showSample=sample;mount.querySelector('.screen-pane').hidden=sample;mount.querySelector('.screen-pane').inert=sample;mount.querySelector('.sample-pane').hidden=!sample;mount.querySelector('.sample-pane').inert=!sample;mount.querySelector('.thumbs').hidden=sample;mount.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.view==='sample')===sample)));mount.querySelector('[data-full]').setAttribute('aria-label',sample?'Expand sample':'Expand screenshot');}
function syncZoom(){const s=mount.querySelector('.screen');if(!s)return;const before=s.classList.contains('zoomed'),expanded=document.fullscreenElement===s||s.classList.contains('preview-zoom');s.classList.toggle('zoomed',expanded);s.querySelector('.information').inert=expanded;s.querySelector('[data-full]')?.setAttribute('aria-pressed',String(expanded));if(before!==expanded&&zoomFrom){const target=s.querySelector('.window');const to=target.getBoundingClientRect(),from=zoomFrom;zoomFrom=null;zoomAnimation?.cancel();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)zoomAnimation=target.animate([{transformOrigin:'0 0',transform:'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')'},{transformOrigin:'0 0',transform:'none'}],{duration:620,easing:'cubic-bezier(.16,1,.3,1)'});}}

render();console.log('Refined software viewer: screenshots, inline sample, external app/source destinations. Mock-up only.');
</script></body></html>
