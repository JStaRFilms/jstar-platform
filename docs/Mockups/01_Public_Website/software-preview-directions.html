<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--foreground,#183324);font:13px Arial,Helvetica,sans-serif}h1,h2,h3,p{margin:0}button,a,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.35;cursor:default}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #b5e619;outline-offset:4px}.options{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.options button{background:none;border:1px solid var(--border,#a1afa4);border-radius:5px;padding:9px 12px;font-size:11px}.options small{opacity:.6;margin-right:6px}.options button[aria-pressed=true]{background:#b5e619;color:#001514;border-color:#b5e619}.screen{background:#091b16;color:#f3f4e9;padding:24px;border-radius:var(--radius,16px);position:relative;overflow:hidden;isolation:isolate}.head{display:flex;align-items:center;justify-content:space-between;height:26px}.brand{font-size:17px;font-weight:700;letter-spacing:-1px;opacity:0;transition:opacity .2s}.brand small{font-size:8px;font-weight:400;letter-spacing:0;margin-left:6px}.screen:hover .brand,.screen:focus-within .brand{opacity:1}.head .label{font-size:9px;letter-spacing:1px;color:#9eb39c}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:27px;min-height:520px;align-items:center;padding-top:27px}.product{min-width:0;transform:rotate(1.5deg);transition:transform .4s;position:relative}.producthead{display:flex;justify-content:space-between;gap:15px;margin-bottom:24px}.producthead em{font:italic 29px Georgia,serif;letter-spacing:-1.2px}.producthead h1{font-size:46px;font-weight:400;line-height:.96;letter-spacing:-2.7px;margin-top:12px}.count{font:italic 30px Georgia,serif;color:#b5e619;margin-top:-9px}.window{background:#111827;overflow:hidden;position:relative}.chrome{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e9ebdf;color:#193627;padding:12px 14px;font-size:8px}.dots{display:flex;gap:4px}.dots i{width:4px;height:4px;background:#6a8168;border-radius:50%}.display{aspect-ratio:16/10;position:relative;overflow:hidden;min-width:0;background:#111827}.display img{width:100%;height:100%;object-fit:contain;display:block}.toolbelt{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;z-index:2;background:#edf0e3;color:#173326;border-radius:30px;padding:11px 16px;margin:-20px auto 0;width:max-content;max-width:94%;box-shadow:0 12px 30px #0003}.toolbelt button,.toolbelt a{font-size:10px;background:none;border:0;padding:3px}.toolbelt .separator{width:1px;height:12px;background:#17332633}.toolbelt .full{font-size:17px;line-height:1}.mediafoot{margin-top:22px;display:flex;justify-content:space-between;font-size:9px;color:#a3b7a8}.information{height:480px;background:#182b22;padding:27px 23px;border:1px solid #9ab19350;position:relative;display:flex;flex-direction:column;min-width:0}.information:before{content:'';position:absolute;top:-8px;left:25px;width:35px;height:15px;background:#b5e619;transform:rotate(-6deg)}.kicker{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#a1b598}.notes-heading{height:156px;flex:none}.information h2{font:italic 28px/1.07 Georgia,serif;letter-spacing:-1.2px;margin:13px 0 12px}.information p{font-size:11px;line-height:1.75;color:#c0cfb8}.brief{flex:1;min-height:0;border-top:1px solid #ffffff25;padding-top:16px}.brief h3{font-size:9px;letter-spacing:1px;font-weight:400;text-transform:uppercase;color:#a1b598;margin-bottom:9px}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.plain{background:none;border:0;padding:0}.readmore{font-size:10px;color:#b5e619;border-bottom:1px solid #b5e61966;margin-top:12px;padding-bottom:5px}.technology{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px;font-size:8px;color:#a1b598;height:18px}.creditfoot{margin-top:18px;border-top:1px solid #ffffff25;padding-top:15px;height:77px;flex:none}.creditfoot .by{font-size:8px;color:#9eb39c;margin-bottom:11px}.person{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left}.person img{width:31px;height:31px;border-radius:50%;object-fit:cover}.person strong{font-weight:400;font-size:10px;display:block}.person small{font-size:8px;color:#9eb39c;display:block;margin-top:3px}.person .arrow{color:#b5e619;margin-left:10px}.foot{border-top:1px solid #ffffff1c;margin-top:25px;padding-top:17px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#96aa98}.arrows{display:flex;gap:15px;align-items:center}.arrows button{background:none;border:0;padding:0 3px;font-size:22px;color:#f3f4e9}.arrows span{font-size:11px;color:#f3f4e9}.caption{margin-top:14px;font-size:13px}.caption p{margin-top:5px;font-size:12px;color:var(--muted-foreground,#53685b);line-height:1.6}.note{font-size:10px;color:var(--muted-foreground,#53685b);margin-top:10px;line-height:1.6}
.canvas .chrome{display:none}.canvas .display{aspect-ratio:auto;height:320px}.canvas .display img{object-fit:contain}.canvas .window{background:#111827}.canvas .toolbelt{background:#b5e619}
.segment{display:flex;gap:15px;margin-bottom:16px;font-size:10px}.segment button{border:0;background:none;padding:0 0 6px;color:#819d88}.segment button[aria-pressed=true]{color:#b5e619;border-bottom:1px solid #b5e619}
.tour .display{aspect-ratio:auto;height:255px}.tour .display img{object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1);transform-origin:50% 47%}.tour .display[data-step="0"] img{transform:scale(1.45);transform-origin:50% 70%}.tour .display[data-step="1"] img{transform:scale(1.9);transform-origin:50% 29%}.tour .display[data-step="2"] img{transform:scale(1.9);transform-origin:80% 46%}.chapters{display:flex;gap:12px;justify-content:space-between;margin-top:18px}.chapters button{background:none;border:0;border-bottom:1px solid #ffffff25;text-align:left;color:#a1b598;font-size:9px;padding:0 0 8px;flex:1}.chapters button[aria-pressed=true]{color:#b5e619;border-color:#b5e619}.chapters small{display:block;font-size:8px;margin-bottom:7px}.tour .toolbelt{margin-top:18px}
.quiz{background:#edf0e3;color:#173326;padding:22px;min-height:255px;display:flex;flex-direction:column;justify-content:center}.quiz .micro{font-size:8px;letter-spacing:1px;color:#537358;text-transform:uppercase}.quiz h3{font-size:21px;font-weight:400;line-height:1.2;letter-spacing:-.8px;margin:15px 0 20px}.answers{display:flex;gap:8px}.answers button{font-size:11px;border:1px solid #6f876844;background:none;padding:10px 15px;border-radius:5px;color:#173326}.answers button[aria-pressed=true]{background:#173326;color:#edf0e3;border-color:#173326}.quiz .feedback{font-size:10px;min-height:32px;color:#365335;margin-top:16px;line-height:1.6}.interactive .quiz{min-height:300px}.interactive .product{transform:rotate(1.5deg)}.missing{height:255px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:#14271d}.missing h3{font:italic 29px/1.1 Georgia,serif;letter-spacing:-1px}.missing p{font-size:11px;color:#a1b598;line-height:1.7;margin-top:14px}
.screen.zoomed .layout{grid-template-columns:1fr}.screen.zoomed .information{display:none}.screen.zoomed .product{transform:none}.screen.zoomed .display{height:440px;aspect-ratio:auto}.screen.zoomed .producthead h1{font-size:54px}.screen.zoomed .quiz{min-height:330px}.screen:fullscreen{width:100%;height:100%;border-radius:0;overflow:auto}.screen.zoomed .producthead{margin-bottom:25px}.screen.zoomed .toolbelt{margin-top:15px}.screen.detail-open .information{visibility:hidden}
.layer{position:absolute;inset:0;z-index:10;background:#00151488;backdrop-filter:blur(4px)}.drawer{position:absolute;background:#e9ebdf;color:#193627;padding:28px;overflow:auto;animation:slide .45s cubic-bezier(.16,1,.3,1) both}.drawer-head{display:flex;align-items:center;justify-content:space-between;font-size:9px;margin-bottom:25px}.drawer-head button{background:none;border:0;padding:5px;font-size:20px}.drawer h2{font:italic 36px/1.07 Georgia,serif;letter-spacing:-1.7px;margin:19px 0 24px}.drawer p{font-size:12px;line-height:1.8;color:#435d42;margin-top:16px}.drawer h3{font-size:12px;font-weight:400;margin-top:25px}.drawer img{width:100%;height:220px;object-fit:cover;object-position:center 25%}.drawer .kicker{color:#58725b}.drawer .role{font-size:10px;line-height:1.6;color:#58725b;margin-top:10px}@keyframes slide{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@media(min-width:900px){.information h2{font-size:35px;max-width:340px}.notes-heading{height:155px}.information p{font-size:12px}}
@media(max-width:700px){.screen{padding:18px}.brand{opacity:1}.brand small{display:none}.layout{grid-template-columns:1fr;gap:32px;min-height:0;padding-top:25px}.producthead h1{font-size:44px}.information{padding:25px}.information h2{font-size:clamp(26px,8vw,32px)}.notes-heading{height:148px}.product{transform:rotate(1deg)}.canvas .display{height:260px}.toolbelt{gap:9px;font-size:9px}.quiz{padding:22px;min-height:250px}.quiz h3{font-size:22px}.foot .arrows{gap:8px}.arrows span{font-size:10px;max-width:125px;text-align:center}.tour .display{height:235px}.drawer{padding:25px}.layer{backdrop-filter:none}}
@media(hover:none){.brand{opacity:1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.drawer{animation:none}}
</style></head><body>
<nav class="options" aria-label="Software presentation options"><button data-option="window"><small>01</small>Product window</button><button data-option="canvas"><small>02</small>Clean canvas</button><button data-option="hybrid"><small>03</small>Screens + sample</button><button data-option="tour"><small>04</small>Guided tour</button><button data-option="interactive"><small>05</small>Interactive first</button></nav><main id="mount"></main><div id="caption" class="caption"></div><p class="note">Existing project screenshot and GitHub destination. The sample quiz is fixed, not AI generation. The tour uses crops of this one screenshot. School product assets are still missing.</p>
<script>
const screenshot='../../../public/portfolio/thumbnails/adaptive-study-game.png';
const portrait='../../../public/team/john-oluleke-oke.jpg';
const sourceHref='https://github.com/JStaRFilms/Adaptive-Study-Game';
const projects=[{title:'Adaptive Study Game',short:'Study Game',type:'Interactive learning'},{title:'School management system',short:'School management',type:'Business software'}];
const descriptions={window:['01 / Product window','A framed interface with a small browser header. A familiar product presentation inside the studio.'],canvas:['02 / Clean canvas','Just the interface, given room to breathe. The closest software equivalent to an uncropped film.'],hybrid:['03 / Screens + sample','Start with the real screenshot, then let visitors try a short sample in the same space.'],tour:['04 / Guided tour','Show a few useful parts of the interface, one at a time. Here, the frames are crops of the existing screenshot.'],interactive:['05 / Interactive first','Open straight into a usable sample. The screenshot and source remain available underneath.']};
let option='window',index=0,showSample=false,step=0,answer='',detail=null,returnFocus=null;
const mount=document.getElementById('mount');
function quiz(){return '<div class="quiz"><span class="micro">Fixed sample / 01 question</span><h3>Which planet is known as the red planet?</h3><div class="answers">'+['Venus','Mars'].map(x=>'<button data-answer="'+x+'" aria-pressed="'+(answer===x)+'">'+x+'</button>').join('')+'</div><p class="feedback" role="status">'+(answer?(answer==='Mars'?'Correct. Mars gets its red colour from iron oxide.':'Try again. Look for the planet with iron oxide on its surface.'):'')+'</p></div>';}
function media(){if(index===1)return '<div class="missing"><div><h3>The actual product<br>belongs here.</h3><p>Screenshot, demo and public destination<br>have not been supplied.</p></div></div>';const sample=option==='interactive'||option==='hybrid'&&showSample;return (option==='hybrid'?'<div class="segment" role="group" aria-label="Product presentation"><button data-view="screen" aria-pressed="'+!showSample+'">Screenshot</button><button data-view="sample" aria-pressed="'+showSample+'">Try the sample</button></div>':'')+'<div class="window">'+(!sample?'<div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span>Adaptive Study Game / interface</span><span>↗</span></div>':'')+(sample?quiz():'<div class="display" data-step="'+step+'"><img src="'+screenshot+'" alt="Existing Adaptive Study Game screenshot, showing study sets and spaced repetition"></div>')+'</div>'+(option==='tour'?'<nav class="chapters" aria-label="Interface tour">'+['Study sets','Review','Create a set'].map((label,i)=>'<button data-step="'+i+'" aria-pressed="'+(step===i)+'"><small>0'+(i+1)+'</small>'+label+'</button>').join('')+'</nav>':'')+'<div class="toolbelt">'+(option==='interactive'?'<button data-show-screen>View screenshot</button>':'<button data-try>Try sample ↗</button>')+'<span class="separator"></span><a href="'+sourceHref+'" target="_blank" rel="noopener noreferrer">Source ↗</a><span class="separator"></span><button class="full" data-full aria-label="Expand product view">⛶</button></div>';}
function notes(){return '<div class="notes-heading"><span class="kicker">Studio Notes</span><h2>'+(index===0?'Turn notes<br>into practice.':'School<br>management.')+'</h2><p>'+(index===0?'A browser-based study tool built around active learning.':'The project name and product description need confirmation.')+'</p></div><section class="brief"><h3>The brief</h3><p class="clamp">'+(index===0?'Studying from static notes can be passive. The aim was to turn those materials into active, personalised practice.':'Who uses the system, what they need to do and what was delivered.')+'</p><button class="plain readmore" data-read>Read more ↗</button></section><div class="technology">'+(index===0?'<span>React</span><span>TypeScript</span><span>Gemini</span>':'<span>Project details pending</span>')+'</div><section class="creditfoot"><div class="by">With</div>'+(index===0?'<button class="person" data-person><img src="'+portrait+'" alt=""><span><strong>John Oluleke-Oke</strong><small>Architect & full-stack developer</small></span><span class="arrow">↗</span></button>':'<p>Contributors to confirm.</p>')+'</section>';}
function render(){const screen=mount.querySelector('.screen'),zoomed=screen?.classList.contains('zoomed')||false;const markup='<section class="screen '+option+(zoomed?' zoomed':'')+'"><div class="core"><header class="head"><span class="brand">J StaR<small>Films Studios</small></span><span class="label">Selected work</span></header><div class="layout"><div class="product"><div class="producthead"><div><em>In use</em><h1>'+projects[index].short+'.</h1></div><span class="count">0'+(index+1)+'</span></div><div id="media">'+media()+'</div><div class="mediafoot"><span>'+projects[index].type.toUpperCase()+'</span><span>Studio Notes</span></div></div><aside class="information" aria-label="Studio Notes">'+notes()+'</aside></div><footer class="foot"><span>SOFTWARE / 0'+(index+1)+' OF 02</span><div class="arrows"><button data-prev '+(index===0?'disabled':'')+' aria-label="Previous software project">←</button><span>'+projects[index].short+'</span><button data-next '+(index===1?'disabled':'')+' aria-label="Next software project">→</button></div></footer></div><div class="layer" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"></section></div></section>';if(!screen)mount.innerHTML=markup;else{const temp=document.createElement('div');temp.innerHTML=markup;screen.querySelector('.core').replaceWith(temp.querySelector('.core'));screen.className='screen '+option+(zoomed?' zoomed':'');}document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===option)));document.getElementById('caption').innerHTML='<strong>'+descriptions[option][0]+'</strong><p>'+descriptions[option][1]+'</p>';}
function openDetail(profile=false){detail=profile?'profile':'brief';returnFocus=document.activeElement;const s=mount.querySelector('.screen'),r=s.querySelector('.information').getBoundingClientRect(),base=s.getBoundingClientRect(),left=innerWidth<=700?0:r.left-base.left;const d=s.querySelector('.drawer');Object.assign(d.style,{left:left+'px',top:'0px',width:base.width-left+'px',height:base.height+'px'});d.innerHTML='<header class="drawer-head"><span>'+projects[index].short.toUpperCase()+' / '+(profile?'CONTRIBUTOR':'STUDIO NOTES')+'</span><button data-close aria-label="Close detail">×</button></header>'+(profile?'<img src="'+portrait+'" alt="John Oluleke-Oke"><div class="role">Lead architect & full-stack developer</div><h2 id="detail-title">John<br>Oluleke-Oke.</h2><p>Role drawn from the existing project record. Personal social links still need approval.</p>':index===0?'<span class="kicker">From the existing project record</span><h2 id="detail-title">Turn notes<br>into practice.</h2><h3>The problem</h3><p>Studying from static notes can be passive. The project aimed to turn those materials into active practice.</p><h3>The approach</h3><p>The existing record describes a browser application that uses PDFs, documents and YouTube URLs to create a visual reading canvas and AI-generated quizzes.</p><h3>The build</h3><p>React, TypeScript, Gemini and local-first browser storage. The record describes parallel generation pipelines to reduce latency.</p><h3>The sample on this site</h3><p>The gallery demonstration is a fixed quiz. It does not generate questions or call Gemini.</p>':'<h2 id="detail-title">Project details<br>to supply.</h2><p>Confirm the product name, original brief, screenshots, collaborators and any public destination.</p>');s.classList.add('detail-open');s.querySelector('.layer').hidden=false;s.querySelector('.core').inert=true;d.querySelector('[data-close]').focus({preventScroll:true});}
function closeDetail(){detail=null;mount.querySelector('.screen').classList.remove('detail-open');mount.querySelector('.layer').hidden=true;mount.querySelector('.core').inert=false;returnFocus?.isConnected&&returnFocus.focus({preventScroll:true});}
document.addEventListener('click',async e=>{if(e.target===mount.querySelector('.layer')){closeDetail();return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.option){option=b.dataset.option;showSample=false;render();return;}if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){index+=b.hasAttribute('data-next')?1:-1;render();return;}if(b.hasAttribute('data-close')){closeDetail();return;}if(b.hasAttribute('data-read')){openDetail();return;}if(b.hasAttribute('data-person')){openDetail(true);return;}if(b.hasAttribute('data-try')){showSample=true;option='hybrid';render();return;}if(b.hasAttribute('data-show-screen')){showSample=false;option='hybrid';render();return;}if(b.dataset.view){showSample=b.dataset.view==='sample';mount.querySelector('#media').innerHTML=media();return;}if(b.dataset.answer){answer=b.dataset.answer;mount.querySelector('.quiz').outerHTML=quiz();mount.querySelector('[data-answer="'+answer+'"]').focus({preventScroll:true});return;}if(b.dataset.step!==undefined){step=Number(b.dataset.step);mount.querySelector('.display').dataset.step=step;mount.querySelectorAll('[data-step]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(Number(x.dataset.step)===step));});return;}if(b.hasAttribute('data-full')){const s=mount.querySelector('.screen');if(s.classList.contains('zoomed')){if(document.fullscreenElement)await document.exitFullscreen();s.classList.remove('zoomed');return;}if(!window.__INLINE_REVIEW__){try{await s.requestFullscreen();}catch{}}s.classList.add('zoomed');}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)mount.querySelector('.screen')?.classList.remove('zoomed');});
document.addEventListener('keydown',e=>{if(detail){if(e.key==='Escape'){e.preventDefault();closeDetail();}if(e.key==='Tab'){const close=mount.querySelector('[data-close]');e.preventDefault();close.focus();}return;}if(e.key==='Escape')mount.querySelector('.screen')?.classList.remove('zoomed');});
render();console.log('Five software presentation options. Existing gallery unchanged; project assets and links come from the repository.');
</script></body></html>
