<nav class="review" aria-label="Review states"><button data-review="notes">Studio Notes</button><button data-review="brief">Expanded brief</button><button data-review="profile">Collaborator profile</button></nav>
<main id="mount"></main><p class="note">Design sample. Team photos and studio socials come from the site; this is not a confirmed film credit roster. Project copy is draft. Inline uses stills; the local HTML plays the supplied films.</p>
<script>
const root='../../../public/';
const films=[{name:'Nifemi',kind:'Full film',poster:root+'redesign/nifemi-poster.jpg',src:root+'redesign/nifemi.mp4'},{name:'Sharon',kind:'Excerpt',poster:root+'redesign/gallery-sharon.jpg',src:root+'redesign/gallery-sharon.mp4'}];
const people=[{id:'studio',name:'J StaR Films Studios',role:'Film and software studio',image:root+'redesign/studio-logo-white.png',links:[['YouTube','https://www.youtube.com/@JStaRFilms'],['Instagram','https://www.instagram.com/j_star.films/']]},{id:'john',name:'John Oluleke-Oke',role:'CEO / Chief Creative Director',image:root+'team/john-oluleke-oke.jpg',links:[]},{id:'nengi',name:'Nengimote Inala',role:'Head of Photography',image:root+'team/nengimote-inala.jpg',links:[]}];
people.push(...[{"id":"JS002","name":"Monjolaoluwa Aminu","role":"Chief Brand & Communications Officer","image":"../../../public/team/monjola-aminu.jpg","links":[]},{"id":"JS003","name":"Sharon Alalibo","role":"Chief Operating Officer & Head of Human Resources","image":"../../../public/team/sharon-alalibo.jpg","links":[]},{"id":"JS004","name":"Justina Ominisan","role":"Head of Software & AI Development","image":"../../../public/team/justina-ominisan.jpg","links":[]},{"id":"JS005","name":"Ifechukwu Odigwe","role":"AI Tools Engineer & Data Scientist","image":"../../../public/team/Ifechukwude-odigwe.jpg","links":[]},{"id":"JS007","name":"Michael Osondu","role":"Lead Graphics Designer","image":"../../../public/team/michael-osondu.jpg","links":[]},{"id":"JS008","name":"Olamide Wunmi-Olajide","role":"Legal & Compliance Advisor","image":"../../../public/team/olamide-wunmi-olajide.jpg","links":[]}]);
let index=0,demoPlaying=false,returnFocus=null,detail=null;const mount=document.getElementById('mount');
const story='A moment, seen differently.';
const brief='Keep the person at the centre. Let the setting support the story without taking it over. The camera should feel close enough to notice the small gestures, with enough space for the moment to breathe.';
function socials(){return '<div class="socials" aria-label="Example project posts"><button disabled>YouTube ↗</button><button disabled>TikTok ↗</button><button disabled>Instagram ↗</button></div>';}
function roster(){return '<div class="sample-label">Example collaborators</div><div class="people">'+people.map(p=>'<button class="person" data-person="'+p.id+'"><img src="'+p.image+'" alt=""><span><strong>'+p.name+'</strong><small>'+p.role+'</small></span><span class="arrow">↗</span></button>').join('')+'</div>';}

function info(){return '<div class="notes-heading"><span class="kicker">Studio Notes</span><h2>'+story+'</h2><p class="subtitle">A short introduction to the person and the piece.</p></div><section class="brief-block"><h3>The brief</h3><p class="clamp">'+brief+'</p><button class="plain readmore" data-read="brief">Read more ↗</button></section>'+socials()+'<section class="creditfoot"><div class="railhead"><span class="by">With / '+String(people.length).padStart(2,'0')+'</span><div class="rail-arrows"><button class="plain" data-credit-prev aria-label="Previous contributors">←</button><button class="plain" data-credit-next aria-label="More contributors">→</button></div></div><div class="contributor-rail" aria-label="Example contributors" tabindex="0">'+people.map(p=>'<button class="contributor" data-person="'+p.id+'" aria-label="View '+p.name+' profile"><span class="portrait-circle '+(p.id==='studio'?'studio':'')+'"><img src="'+p.image+'" alt=""></span><span>'+ (p.id==='studio'?'J StaR Films<br>Studios':p.name.split(' ')[0]+'<br>'+p.name.split(' ').slice(1).join(' '))+'</span><span class="link-arrow">↗</span></button>').join('')+'</div></section>';}
function destroy(){const v=mount.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load();}}
function render(){destroy();detail=null;demoPlaying=false;const p=films[index];const markup='<section class="screen wipe"><div class="core"><header class="head"><span class="brand">J StaR<small>Films Studios</small></span><span class="head-label">Selected work</span></header><div class="layout"><div class="cinema"><div class="filmhead"><div><em>Now showing</em><h1>'+p.name+'.</h1></div><span class="count">0'+(index+1)+'</span></div><div class="picture"><img src="'+p.poster+'" alt="'+p.name+' film still"><button class="play" data-play aria-label="Play '+p.name+'">▶</button></div><div class="controlbar"><button data-play aria-label="Play film">▶</button><span class="time">--:--</span><input class="seek" aria-label="Seek video" type="range" value="0" min="0" max="100" disabled><button class="sound" data-mute aria-label="Mute video">Sound</button><button data-full aria-label="Open fullscreen cinema" aria-pressed="false">⛶</button></div><div class="mediafoot"><span>'+p.kind.toUpperCase()+'</span><span>Studio Notes</span></div></div><aside class="information" aria-label="Studio Notes">'+info()+'</aside></div><footer class="foot"><span>FILM / 0'+(index+1)+' OF 02</span><div class="arrows"><button data-prev '+(index===0?'disabled':'')+' aria-label="Previous project">←</button><span>'+p.name+'</span><button data-next '+(index===1?'disabled':'')+' aria-label="Next project">→</button></div></footer></div><div class="layer" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"></section></div></section>';if(!mount.firstElementChild){mount.innerHTML=markup;}else{const temp=document.createElement('div');temp.innerHTML=markup;mount.querySelector('.core').replaceWith(temp.querySelector('.core'));mount.querySelector('.layer').hidden=true;}mount.querySelector('.screen').classList.remove('detail-open');setPlaying(false);syncCinema();const rail=mount.querySelector(".contributor-rail");rail.addEventListener("scroll",updateCreditArrows,{passive:true});requestAnimationFrame(updateCreditArrows);}

function openDetail(kind,id){returnFocus=document.activeElement;detail={kind,id};const drawer=mount.querySelector('.drawer');const head='<header class="drawer-head"><span>'+films[index].name.toUpperCase()+' / '+(kind==='profile'?'COLLABORATOR':'STUDIO NOTES')+'</span><button data-close aria-label="Close detail">×</button></header>';if(kind==='profile'){const p=people.find(x=>x.id===id);drawer.innerHTML=head+'<div class="profile-picture '+(id==='studio'?'studio':'')+'"><img src="'+p.image+'" alt="'+p.name+'"></div><div class="profile-role">'+p.role+'</div><h2 id="detail-title" class="profile-name">'+p.name+'.</h2>'+(p.links.length?'<div class="socials">'+p.links.map(([label,href])=>'<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+label+' ↗</a>').join('')+'</div>':'<p class="source-note">Personal social links await approval.</p>')+'<div class="rule"><span class="kicker">About this profile</span><p>Photo and role from the existing site. Participation in this film still needs confirmation.</p></div>';}else{drawer.innerHTML=head+'<span class="kicker">Draft layout copy</span><h2 id="detail-title">'+(id==='brief'?'The original idea.':story)+'</h2><p>'+brief+'</p><h3>The feeling</h3><p>Make room for stillness. Follow the pace of the person, not the pace of a template. Movement, colour and music should help tell the same story.</p><h3>The finish</h3><p>The edit should leave a clear memory of the person and the occasion. Keep the intention intact across the full piece and the shorter published versions.</p><div class="rule"><span class="kicker">The people behind it</span>'+roster()+'</div>';}drawer.scrollTop=0;positionDetail();mount.querySelector('.screen').classList.add('detail-open');revealControls();mount.querySelector('.layer').hidden=false;mount.querySelector('.core').inert=true;drawer.querySelector('[data-close]').focus({preventScroll:true});}
function closeDetail(){if(!detail)return;detail=null;mount.querySelector('.screen').classList.remove('detail-open');revealControls();mount.querySelector('.layer').hidden=true;mount.querySelector('.core').inert=false;if(returnFocus?.isConnected&&!returnFocus.closest('.layer'))returnFocus.focus({preventScroll:true});else mount.querySelector('[data-read="brief"]')?.focus({preventScroll:true});}
function setPlaying(value){mount.querySelector('.screen')?.classList.toggle('is-playing',value);mount.querySelector('.cinema')?.classList.toggle('playing',value);mount.querySelectorAll('[data-play]').forEach(b=>{b.textContent=value?'Ⅱ':'▶';b.setAttribute('aria-label',value?'Pause film':'Play film');});revealControls();}
function time(t){return Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'--:--';}
async function play(){if(window.__INLINE_REVIEW__){demoPlaying=!demoPlaying;setPlaying(demoPlaying);if(demoPlaying&&!mount.querySelector('.viewmsg'))mount.querySelector('.picture').insertAdjacentHTML('beforeend','<span class="viewmsg">PLAYBACK LAYOUT PREVIEW</span>');if(!demoPlaying)mount.querySelector('.viewmsg')?.remove();return;}let v=mount.querySelector('video');if(!v){v=document.createElement('video');v.src=films[index].src;v.poster=films[index].poster;v.playsInline=true;v.preload='none';v.setAttribute('aria-label',films[index].name+' '+films[index].kind);mount.querySelector('.picture img').replaceWith(v);for(const event of ['play','pause','ended'])v.addEventListener(event,()=>{if(v.isConnected)setPlaying(!v.paused);});v.addEventListener('timeupdate',()=>{if(!v.isConnected)return;mount.querySelector('.time').textContent=time(v.currentTime)+' / '+time(v.duration);const r=mount.querySelector('.seek');if(Number.isFinite(v.duration)&&v.duration>0){r.disabled=false;r.value=v.currentTime/v.duration*100;}});v.addEventListener('error',()=>{if(v.isConnected)mount.querySelector('.picture').innerHTML='<p style="padding:20px;font-size:12px">Video unavailable. Switch project and try again.</p>';});}if(v.paused)await v.play().catch(()=>{});else v.pause();}
document.addEventListener('click',async e=>{if(e.target===mount.querySelector('.layer')){closeDetail();return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.review){closeDetail();if(mount.querySelector('.screen').classList.contains('expanded'))await exitCinema();if(b.dataset.review==='notes')return;if(b.dataset.review==='brief'){openDetail('text','brief');return;}openDetail('profile','john');return;}if(b.hasAttribute('data-close')){closeDetail();return;}if(b.dataset.person){openDetail('profile',b.dataset.person);return;}if(b.dataset.read){openDetail('text',b.dataset.read);return;}if(b.hasAttribute('data-credit-next')||b.hasAttribute('data-credit-prev')){const rail=mount.querySelector('.contributor-rail');rail.scrollBy({left:(b.hasAttribute('data-credit-next')?1:-1)*Math.max(130,rail.clientWidth*.85),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){index+=b.hasAttribute('data-next')?1:-1;render();return;}if(b.hasAttribute('data-play')){void play();return;}if(b.hasAttribute('data-mute')){const v=mount.querySelector('video');if(v){v.muted=!v.muted;b.textContent=v.muted?'Muted':'Sound';}else b.textContent=b.textContent==='Sound'?'Muted':'Sound';return;}if(b.hasAttribute('data-full')){await toggleCinema();}});
function syncCinema(){const s=mount.querySelector('.screen');if(!s)return;const wasExpanded=s.classList.contains('expanded');const expanded=document.fullscreenElement===s||s.classList.contains('preview-fullscreen');s.classList.toggle('expanded',expanded);s.querySelector('.information').inert=expanded;const b=s.querySelector('[data-full]');b?.setAttribute('aria-label',expanded?'Exit fullscreen cinema':'Open fullscreen cinema');b?.setAttribute('aria-pressed',String(expanded));revealControls();if(wasExpanded!==expanded&&zoomFrom){animateZoom(zoomFrom);zoomFrom=null;}}
async function exitCinema(){zoomFrom=mount.querySelector('.picture').getBoundingClientRect();if(document.fullscreenElement)await document.exitFullscreen();mount.querySelector('.screen')?.classList.remove('preview-fullscreen');syncCinema();mount.querySelector('[data-full]')?.focus({preventScroll:true});}
async function toggleCinema(){const s=mount.querySelector('.screen');if(s.classList.contains('expanded')){await exitCinema();return;}zoomFrom=mount.querySelector('.picture').getBoundingClientRect();if(window.__INLINE_REVIEW__){s.classList.add('preview-fullscreen');syncCinema();return;}try{await s.requestFullscreen();syncCinema();}catch{s.classList.add('preview-fullscreen');syncCinema();}}
document.addEventListener('fullscreenchange',()=>{syncCinema();if(!document.fullscreenElement)mount.querySelector('[data-full]')?.focus({preventScroll:true});});
document.addEventListener('input',e=>{if(e.target.matches('.seek')){const v=mount.querySelector('video');if(v&&Number.isFinite(v.duration))v.currentTime=e.target.value/100*v.duration;}});
document.addEventListener('keydown',e=>{if(mount.querySelector('.screen')?.contains(e.target)){keyboardMode=true;revealControls();}if(detail){if(e.key==='Escape'){e.preventDefault();closeDetail();return;}if(e.key==='Tab'){const list=[...mount.querySelector('.drawer').querySelectorAll('button:not(:disabled),a[href]')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.key==='Escape'&&mount.querySelector('.screen').classList.contains('expanded'))void exitCinema();});
function updateCreditArrows(){const rail=mount.querySelector('.contributor-rail');if(!rail)return;const prev=mount.querySelector('[data-credit-prev]'),next=mount.querySelector('[data-credit-next]');prev.disabled=rail.scrollLeft<2;next.disabled=rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-2;}
window.addEventListener('resize',updateCreditArrows);


let zoomFrom=null,zoomAnimation=null;
function animateZoom(from){zoomAnimation?.cancel();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const picture=mount.querySelector('.picture'),to=picture.getBoundingClientRect();if(!from.width||!from.height||!to.width||!to.height)return;const cinema=mount.querySelector('.cinema');cinema.style.zIndex='6';zoomAnimation=picture.animate([{transformOrigin:'0 0',transform:'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')'},{transformOrigin:'0 0',transform:'translate(0,0) scale(1,1)'}],{duration:620,easing:'cubic-bezier(.16,1,.3,1)'});const current=zoomAnimation;current.finished.catch(()=>{}).finally(()=>{if(zoomAnimation===current){cinema.style.removeProperty('z-index');zoomAnimation=null;}});}

let controlsTimer=0,keyboardMode=false;
function positionDetail(){const screen=mount.querySelector('.screen'),panel=mount.querySelector('.information'),drawer=mount.querySelector('.drawer');if(!screen||!panel||!drawer)return;const base=screen.getBoundingClientRect(),r=panel.getBoundingClientRect(),left=innerWidth<=700?0:r.left-base.left;Object.assign(drawer.style,{left:left+'px',top:'0px',width:(base.width-left)+'px',height:base.height+'px'});}
function revealControls(){clearTimeout(controlsTimer);const screen=mount.querySelector('.screen');if(!screen)return;screen.classList.remove('controls-idle');screen.querySelector('.controlbar').inert=false;screen.querySelector('.foot').inert=false;if(!screen.classList.contains('is-playing')||detail||keyboardMode)return;controlsTimer=setTimeout(()=>{if(!screen.isConnected||!screen.classList.contains('is-playing')||detail||keyboardMode)return;screen.classList.add('controls-idle');screen.querySelector('.controlbar').inert=true;if(screen.classList.contains('expanded'))screen.querySelector('.foot').inert=true;},1800);}
let pointerPosition=null;
mount.addEventListener('pointermove',e=>{const moved=!pointerPosition||Math.abs(e.clientX-pointerPosition.x)+Math.abs(e.clientY-pointerPosition.y)>=1;pointerPosition={x:e.clientX,y:e.clientY};if(moved&&!detail)revealControls();});
mount.addEventListener('pointerdown',e=>{pointerPosition={x:e.clientX,y:e.clientY};keyboardMode=false;revealControls();});
mount.addEventListener('focusout',()=>{requestAnimationFrame(()=>{if(!mount.querySelector('.screen')?.contains(document.activeElement)){keyboardMode=false;revealControls();}});});
window.addEventListener('resize',()=>{if(detail)positionDetail();});

render();console.log('Linear Studio Notes. In-place detail panel and idle playback controls. Mock-up only.');
</script></body></html>
