*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--foreground,#172a21)}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #b5e619;outline-offset:4px}.choices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.choices button{background:transparent;border:1px solid var(--border,#a8b4a9);color:inherit;padding:9px 12px;border-radius:5px;font-size:11px}.choices button[aria-pressed=true]{background:#b5e619;color:#001514;border-color:#b5e619}.choices b{font-weight:400;opacity:.55;margin-right:6px}.concept{background:#001514;color:#f3f4e9;border-radius:var(--radius,16px);padding:24px;overflow:hidden;position:relative;isolation:isolate}.bar{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:1px;position:relative;z-index:5}.brand{font-size:17px;font-weight:700;letter-spacing:-1px}.brand i{font-size:8px;font-style:normal;letter-spacing:.1px;font-weight:400;margin-left:6px;opacity:.7}.bar span:last-child{opacity:.7}.bottom{display:flex;justify-content:space-between;font-size:9px;position:relative;z-index:5;letter-spacing:.7px}.body{height:455px;position:relative;margin:24px 0}.body h1,.body h2,.body p{margin:0}.body h1,.body h2{font-weight:400;letter-spacing:-.065em;line-height:.9}.tiny{font-size:9px;text-transform:uppercase;letter-spacing:1px}.lime{color:#b5e619}.pick{background:none;color:inherit;border:0;text-align:left;padding:0}.pic{width:100%;height:100%;object-fit:cover;display:block}.art{background:#f3f5eb}.art img{object-fit:contain}.tag{display:flex;align-items:center;justify-content:space-between;font-size:9px}.round{display:grid;place-items:center;width:38px;height:38px;border:1px solid currentColor;border-radius:50%;font-size:16px;flex-shrink:0}.caption{margin:14px 0 0;font-size:13px}.caption strong{font-weight:500}.caption p{color:var(--muted-foreground,#53675b);font-size:12px;margin:5px 0 0;line-height:1.6}
.index .body{display:grid;grid-template-columns:45% 55%;gap:0}.index h1{font-size:clamp(42px,7vw,66px);margin:22px 0 33px}.index h1 span{display:block}.list{padding-right:26px}.list .pick{display:flex;align-items:center;gap:10px;width:100%;border-bottom:1px solid #ffffff22;padding:13px 0;color:#90a097}.list .pick b{font-size:10px;font-weight:400;min-width:17px}.list .pick strong{font-size:17px;font-weight:400;letter-spacing:-.65px;flex:1}.list .pick em{font-size:15px;font-style:normal;opacity:0}.list .pick[aria-pressed=true]{color:#f3f4e9}.list .pick[aria-pressed=true] b{color:#b5e619}.list .pick[aria-pressed=true] em{opacity:1}.stack{position:relative;align-self:center;height:295px;margin-left:18px}.ghost{position:absolute;inset:0;background:#5d735f;transform:rotate(-9deg) translate(-6px,-18px)}.ghost.two{background:#bac6a4;transform:rotate(-4deg) translate(-2px,-9px)}.front{position:absolute;inset:0;box-shadow:0 18px 35px #0005;overflow:hidden;transform:rotate(3deg);transition:transform .4s}.front:hover{transform:rotate(0deg)}.front .tag{position:absolute;bottom:0;left:0;right:0;padding:14px;background:#001514c9}.stack .filmname{position:absolute;bottom:46px;left:18px;color:white;font-size:51px;letter-spacing:-3px}.stack .under{position:absolute;top:323px;width:100%;display:flex;justify-content:space-between;font-size:10px}
.theatre{padding:24px;min-height:560px}.theatre .backdrop{position:absolute;inset:0;z-index:-2}.theatre:before{content:"";position:absolute;inset:0;background:#00151469;z-index:-1}.theatre .body{height:422px;display:flex;flex-direction:column;justify-content:center}.theatre .display-title{font-size:clamp(74px,16vw,138px);letter-spacing:-.085em}.theatre .display-title span{display:block;font:italic 400 .46em Georgia,serif;letter-spacing:-.07em;margin-bottom:15px}.theatre .filmmeta{display:flex;align-items:center;gap:20px;margin-top:28px}.theatre .filmmeta .round{background:#f3f4e9;color:#001514;border:0;width:46px;height:46px}.theatre .navfilms{display:flex;gap:18px;margin-top:auto;padding-top:40px}.theatre .navfilms button{font-size:11px;border-bottom:1px solid transparent;padding:0 0 7px;color:#d1d9cf}.theatre .navfilms button[aria-pressed=true]{border-color:#b5e619;color:#b5e619}.theatre .fraction{position:absolute;top:22px;right:0;font:italic 42px Georgia,serif}
.editorial{background:#ecebdd;color:#173323}.editorial .body{height:auto;min-height:455px}.editorial .edhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #173323;padding-bottom:18px}.editorial h1{font:400 clamp(57px,10vw,89px)/.95 Georgia,serif;letter-spacing:-.07em}.editorial .edhead .tiny{max-width:90px;line-height:1.7}.editorial .spread{display:grid;grid-template-columns:1.35fr .85fr;gap:28px;padding-top:25px;align-items:start}.editorial .edimage{height:212px;overflow:hidden;position:relative}.editorial .edimage img{transition:transform .6s}.editorial .edimage:hover img{transform:scale(1.035)}.editorial .editem{width:100%}.editorial .editem:nth-child(2){padding-top:44px}.editorial .editem:nth-child(2) .edimage{height:157px}.editorial .edlabel{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.editorial .edlabel h2{font:400 25px Georgia,serif;letter-spacing:-1px}.editorial .edlabel small{display:block;font-size:9px;margin-top:5px;letter-spacing:.5px}.editorial .edlinks{display:flex;justify-content:space-between;border-top:1px solid #17332355;margin-top:28px;padding-top:13px;font-size:11px}.editorial .edlinks button{border-bottom:1px solid #17332355;padding-bottom:4px}
.type .body{height:455px;padding-top:18px}.type .typehead{display:flex;justify-content:space-between;margin-bottom:22px}.type .typehead .tiny{color:#98afa0}.type .type-row{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:clamp(36px,7.3vw,67px);letter-spacing:-.07em;line-height:1.02;padding:13px 0;border-bottom:1px solid #ffffff22}.type .type-row .name{position:relative;z-index:2}.type .type-row small{font-size:9px;letter-spacing:0;font-weight:400;max-width:64px;text-align:right;line-height:1.6;z-index:2}.type .type-row:not([aria-pressed=true]) .name{-webkit-text-stroke:1px #72907d;color:transparent}.type .type-row[aria-pressed=true] .name{color:#b5e619}.type .float-img{position:absolute;z-index:1;width:165px;height:113px;right:65px;transform:rotate(9deg);box-shadow:0 12px 30px #0006;opacity:.87;pointer-events:none}.type .type-row:not([aria-pressed=true]) .float-img{display:none}.type .type-row[aria-pressed=true] small{color:#b5e619}.type .typefoot{margin-top:28px;display:flex;justify-content:space-between;align-items:center}.type .typefoot p{font:italic 20px Georgia,serif}.type .typefoot .round{color:#b5e619}
.strip .body{height:455px;padding-top:5px}.strip .striphead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:35px}.strip h1{font-size:63px}.strip h1 em{font:italic 400 .85em Georgia,serif}.strip .arrows{display:flex;gap:8px}.strip .arrows button{color:#b5e619;background:transparent}.strip .rail{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:4px 0 16px}.strip .rail::-webkit-scrollbar{display:none}.strip .tile{flex:0 0 72%;scroll-snap-align:start;min-width:0}.strip .tile-image{height:232px;position:relative;overflow:hidden}.strip .tile-image .pic{transition:transform .45s}.strip .tile:hover .pic{transform:scale(1.03)}.strip .tile .label{display:flex;justify-content:space-between;align-items:center;padding-top:13px}.strip .tile h2{font-size:27px;letter-spacing:-1px}.strip .tile small{font-size:9px;color:#a8b9a9;display:block;margin-top:6px}.strip .tile .round{width:29px;height:29px;font-size:13px}.strip .stripnote{display:flex;justify-content:space-between;margin-top:22px}.strip .stripnote span{font-size:9px;letter-spacing:1px;color:#a8b9a9}.enter{animation:appear .45s both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.enter{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:500px){.concept{padding:20px}.brand i{display:none}.body{margin:20px 0}.index .body{grid-template-columns:1fr;height:auto}.index h1{font-size:51px;margin:12px 0 20px}.index h1 span{display:inline}.list{padding-right:0}.list .pick{padding:11px 0}.list .pick strong{font-size:17px}.stack{height:230px;margin:42px 9px 45px}.stack .under{top:251px}.index .bottom{margin-top:10px}.theatre .body{height:420px}.theatre .display-title{font-size:87px}.theatre .fraction{font-size:30px}.theatre .navfilms{gap:14px;flex-wrap:wrap}.editorial .spread{gap:16px;grid-template-columns:1.2fr 1fr}.editorial .edhead .tiny{display:none}.editorial h1{font-size:65px}.editorial .edimage{height:210px}.editorial .editem:nth-child(2){padding-top:55px}.editorial .editem:nth-child(2) .edimage{height:155px}.editorial .edlabel h2{font-size:24px}.editorial .edlabel .round{width:23px;height:23px;font-size:12px}.editorial .edlinks{gap:20px;line-height:1.6}.editorial .body{min-height:465px}.type .type-row{font-size:40px;padding:20px 0}.type .float-img{width:116px;height:82px;right:34px;opacity:.55}.type .type-row small{font-size:8px;max-width:45px}.type .typefoot p{font-size:17px}.type .body{height:430px}.strip h1{font-size:48px}.strip .tile{flex-basis:88%}.strip .tile-image{height:250px}.strip .striphead{margin-bottom:30px}.strip .body{height:460px}.strip .arrows .round{width:30px;height:30px}.choices button{padding:8px 9px;font-size:10px}}
</style></head><body>
<nav class="choices" aria-label="Gallery directions"><button data-direction="index"><b>01</b>The collection</button><button data-direction="theatre"><b>02</b>The cinema</button><button data-direction="editorial"><b>03</b>The editorial</button><button data-direction="type"><b>04</b>The statement</button><button data-direction="strip"><b>05</b>The filmstrip</button></nav>
<main id="mount"></main><div class="caption" id="caption"></div>
<script>
const images={nifemi:"../../../public/redesign/gallery-nifemi.jpg",sharon:"../../../public/redesign/gallery-sharon.jpg",study:"../../../public/portfolio/thumbnails/adaptive-study-game.png"};
const items=[{id:'nifemi',name:'Nifemi',kind:'Film',image:images.nifemi},{id:'sharon',name:'Sharon',kind:'Film excerpt',image:images.sharon},{id:'study',name:'Adaptive Study Game',short:'Study Game',kind:'Software',image:images.study},{id:'school',name:'School management',short:'School system',kind:'Software',image:null}];
const descriptions={index:['01 / The collection','A precise project index and a floating stack. Closest to your current gallery, with stronger proportions and less clutter.'],theatre:['02 / The cinema','One project fills the screen. Project changes become film cuts, with software switching to its real interface.'],editorial:['03 / The editorial','Warm paper, serif titles and an asymmetric image layout. More art direction, less interface.'],type:['04 / The statement','Project names become the composition. A small image follows the active title. Built for bold hover and scroll transitions.'],strip:['05 / The filmstrip','A horizontal sequence of oversized project frames. The next project stays visible, inviting the visitor forward.']};
let direction='index',active='nifemi';
const mount=document.getElementById('mount');
const bar=()=>'<header class="bar"><span class="brand">J StaR<i>Films Studios</i></span><span>SELECTED WORK / 04</span></header>';
const bottom=()=>'<footer class="bottom"><span>FILM + SOFTWARE</span><span>MEET THE TEAM ↓</span></footer>';
function photo(p,extra=''){return p.image?'<img class="pic '+extra+'" src="'+p.image+'" alt="'+p.name+' project image">':'<div style="height:100%;background:#cbd6b8;color:#21462f;display:flex;align-items:center;padding:24px;font-size:30px;letter-spacing:-1px">School<br>management.<span style="font-size:9px;margin-left:20px;letter-spacing:0">Cover study<br>Image pending</span></div>';}
function index(p){return '<div class="body"><div class="list"><h1>Made to<br><span class="lime">move you.</span></h1>'+items.map((x,i)=>'<button class="pick" data-project="'+x.id+'" aria-pressed="'+(x.id===active)+'"><b>0'+(i+1)+'</b><strong>'+x.name+'</strong><em>↗</em></button>').join('')+'</div><div class="stack"><div class="ghost"></div><div class="ghost two"></div><button class="front pick '+(p.kind==='Software'?'art':'')+'" data-cycle aria-label="Preview next project">'+photo(p)+(p.kind!=='Software'?'<span class="filmname">'+p.name+'.</span>':'')+'<span class="tag"><span>'+p.kind.toUpperCase()+'</span><span>↗</span></span></button><div class="under"><span>'+p.name+'</span><span>0'+(items.indexOf(p)+1)+' / 04</span></div></div></div>';}
function theatre(p){return '<div class="backdrop '+(p.kind==='Software'?'art':'')+'">'+photo(p)+'</div><div class="body"><span class="fraction">0'+(items.indexOf(p)+1)+'</span><h1 class="display-title"><span>Selected work</span>'+(p.short||p.name)+'.</h1><div class="filmmeta"><button class="pick round" data-cycle aria-label="Preview next project">↗</button><span class="tiny">'+p.kind+'<br><span style="opacity:.65">J StaR Films Studios</span></span></div><nav class="navfilms" aria-label="Choose project">'+items.map((x,i)=>'<button class="pick" data-project="'+x.id+'" aria-pressed="'+(x.id===active)+'">0'+(i+1)+' / '+(x.short||x.name)+'</button>').join('')+'</nav></div>';}
function editorial(){const films=active==='study'||active==='school'?items.slice(2):items.slice(0,2);return '<div class="body"><div class="edhead"><h1>Selected<br><i>works.</i></h1><span class="tiny">Independent<br>in thought.<br>Shared in work.</span></div><div class="spread">'+films.map(p=>'<button class="editem pick" data-project="'+(p.id===active?(p.id==='nifemi'?'sharon':p.id==='study'?'school':p.id==='school'?'study':'nifemi'):p.id)+'"><div class="edimage '+(p.kind==='Software'?'art':'')+'">'+photo(p)+'</div><div class="edlabel"><div><h2>'+p.name+'</h2><small>'+p.kind+'</small></div><span class="round">↗</span></div></button>').join('')+'</div><div class="edlinks"><button class="pick" data-project="nifemi">01 / Film ↗</button><button class="pick" data-project="study">02 / Software ↗</button></div></div>';}
function type(){return '<div class="body"><div class="typehead"><span class="tiny">Selected work</span><span class="tiny">Hover / tap to explore</span></div>'+items.map((p,i)=>'<button class="pick type-row" data-project="'+p.id+'" data-hover="'+p.id+'" aria-pressed="'+(active===p.id)+'"><span class="name">'+(p.short||p.name)+'.</span>'+(p.image?'<img class="float-img" src="'+p.image+'" alt="">':'')+'<small>0'+(i+1)+'<br>'+p.kind+'</small></button>').join('')+'<div class="typefoot"><p>Films you feel. Software you use.</p><button class="pick round" data-cycle aria-label="Next project">↗</button></div></div>';}
function strip(){return '<div class="body"><div class="striphead"><h1>Work in<br><em>motion.</em></h1><div class="arrows"><button class="round" data-prev aria-label="Previous project">←</button><button class="round" data-next aria-label="Next project">→</button></div></div><div class="rail" aria-label="Project frames" tabindex="0">'+items.map((p,i)=>'<button class="pick tile" data-tile="'+i+'" data-project="'+p.id+'"><div class="tile-image '+(p.kind==='Software'?'art':'')+'">'+photo(p)+'</div><div class="label"><div><h2>'+p.name+'.</h2><small>0'+(i+1)+' / '+p.kind+'</small></div><span class="round">↗</span></div></button>').join('')+'</div><div class="stripnote"><span>SCROLL / SWIPE TO EXPLORE</span><span>04 PROJECTS</span></div></div>';}
function render(){const p=items.find(x=>x.id===active);mount.innerHTML='<section class="concept '+direction+'">'+bar()+'<div class="enter">'+(direction==='index'?index(p):direction==='theatre'?theatre(p):direction==='editorial'?editorial():direction==='type'?type():strip())+'</div>'+bottom()+'</section>';document.getElementById('caption').innerHTML='<strong>'+descriptions[direction][0]+'</strong><p>'+descriptions[direction][1]+'</p>';document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===direction)));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.direction){direction=b.dataset.direction;active='nifemi';render();return}if(direction==='strip'){const rail=document.querySelector('.rail');if(b.hasAttribute('data-next')||b.hasAttribute('data-prev')){rail.scrollBy({left:(b.hasAttribute('data-next')?1:-1)*rail.clientWidth*.76,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return}if(b.dataset.project){const tile=b.closest('.tile');tile?.scrollIntoView({block:'nearest',inline:'start',behavior:'smooth'});return}}if(b.dataset.project){active=b.dataset.project;render();document.querySelector('[data-project="'+active+'"]')?.focus({preventScroll:true});return}if(b.hasAttribute('data-cycle')){active=items[(items.findIndex(x=>x.id===active)+1)%items.length].id;render();}});
document.addEventListener('pointerover',e=>{const b=e.target.closest('[data-hover]');if(!b||b.dataset.hover===active||e.pointerType==='touch')return;active=b.dataset.hover;const p=items.find(x=>x.id===active);document.querySelectorAll('.type-row').forEach(row=>row.setAttribute('aria-pressed',String(row.dataset.project===active)));});
render();console.log('Five gallery directions. Existing project images. Gallery only; no project viewers.');
</script></body></html>
