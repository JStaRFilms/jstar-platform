<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--foreground,#183324);font:13px Arial,Helvetica,sans-serif}h1,h2,h3,p{margin:0}button,a,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.35;cursor:default}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #b5e619;outline-offset:4px}.review{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.review button{font-size:11px;background:transparent;border:1px solid var(--border,#a1afa4);border-radius:5px;padding:8px 12px}.screen{background:#091b16;color:#f3f4e9;border-radius:var(--radius,16px);padding:24px;overflow:hidden;position:relative;isolation:isolate}.head{display:flex;align-items:center;justify-content:space-between;height:26px;font-size:10px}.brand{font-size:17px;font-weight:700;letter-spacing:-1px;opacity:0;transition:opacity .2s}.brand small{font-size:8px;font-weight:400;letter-spacing:0;margin-left:6px}.screen:hover .brand,.screen:focus-within .brand{opacity:1}.plain{background:none;border:0;padding:0}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:27px;min-height:490px;align-items:center;padding-top:27px}.cinema{min-width:0;transform:rotate(1.5deg);transition:transform .4s;position:relative}.filmhead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.filmhead em{font:italic 25px Georgia,serif;letter-spacing:-1px}.filmhead h1{font-size:60px;font-weight:400;letter-spacing:-3.8px;line-height:1;margin-top:8px}.count{font:italic 30px Georgia,serif;color:#b5e619;margin-top:-9px}.picture{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.picture img,.picture video{display:block;width:100%;height:100%;object-fit:contain}.picture img{position:absolute;inset:0}.play{position:absolute;inset:0;width:46px;height:46px;margin:auto;background:#edf0e3;color:#173326;border:0;border-radius:50%;font-size:17px}.playing .picture>.play{display:none}.controlbar{display:flex;align-items:center;gap:8px;width:93%;padding:8px 12px;margin:-19px auto 0;border-radius:30px;background:#edf0e3;color:#173326;position:relative;z-index:2;box-shadow:0 12px 30px #0003}.controlbar button{background:none;border:0;padding:3px;min-width:23px;min-height:25px;font-size:13px}.controlbar .sound{font-size:9px}.time{font-size:9px;white-space:nowrap;font-variant-numeric:tabular-nums}.seek{accent-color:#23442b;height:3px;min-width:0;flex:1;margin:0}.mediafoot{margin-top:23px;display:flex;justify-content:space-between;font-size:9px;color:#a3b7a8}.mediafoot button{font-size:10px;color:#f3f4e9}.information{background:#182b22;padding:27px 23px;border:1px solid #9ab19350;position:relative;min-width:0;min-height:385px}.information:before{content:'';position:absolute;top:-8px;left:25px;width:35px;height:15px;background:#b5e619;transform:rotate(-6deg)}.kicker{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#a1b598}.tabbar{display:flex;gap:17px;margin:19px 0 24px;border-bottom:1px solid #ffffff25}.tabbar button{font-size:10px;background:none;border:0;padding:0 0 11px;color:#9eb39c}.tabbar button[aria-selected=true]{color:#b5e619;border-bottom:1px solid #b5e619}.tab-content{min-height:151px}.information h2{font:italic 36px/1.05 Georgia,serif;letter-spacing:-1.5px;margin-bottom:15px}.information p{font-size:12px;color:#c0cfb8;line-height:1.75}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.readmore{font-size:10px;color:#b5e619;margin-top:13px;border-bottom:1px solid #b5e61966;padding-bottom:5px}.socials{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.socials a,.socials button{font-size:10px;border:0;background:none;border-bottom:1px solid currentColor;padding:0 0 5px}.socials button{opacity:.35}.creditfoot{border-top:1px solid #ffffff25;padding-top:15px;margin-top:23px}.creditfoot .by{font-size:8px;color:#9eb39c;margin-bottom:10px}.faces{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.avatar{display:flex;align-items:center;justify-content:center;border:1px solid #91a38950;background:#102019;width:31px;height:31px;border-radius:50%;padding:0;overflow:hidden;font-size:10px}.avatar img{width:100%;height:100%;object-fit:cover}.faces .studio-link{font-size:9px;margin-right:2px;text-align:left;line-height:1.5}.people{display:flex;flex-direction:column;gap:12px}.person{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:0;width:100%}.person img{width:31px;height:31px;object-fit:cover;border-radius:50%}.person strong{display:block;font-size:11px;font-weight:400}.person small{display:block;color:#9eb39c;font-size:8px;margin-top:3px}.person .arrow{margin-left:auto;color:#b5e619;font-size:15px}.sample-label{font-size:8px;color:#90a187;margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}.foot{border-top:1px solid #ffffff1c;margin-top:25px;padding-top:17px;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.5px;color:#96aa98}.arrows{display:flex;gap:15px;align-items:center}.arrows button{background:none;border:0;font-size:20px;padding:0 3px;color:#f3f4e9}.arrows span{font-size:10px;color:#f3f4e9}.note{font-size:10px;line-height:1.6;color:var(--muted-foreground,#53685b);margin-top:12px}.expanded .layout{grid-template-columns:1fr}.expanded .information{display:none}.expanded .cinema{transform:none}.expanded .picture{height:390px;aspect-ratio:auto}.expanded .filmhead{position:absolute;left:23px;right:23px;top:22px;z-index:1;pointer-events:none;text-shadow:0 2px 20px #000}.expanded .filmhead h1{font-size:78px}.expanded .controlbar{width:min(80%,460px)}.expanded .playing .filmhead{opacity:0}
.layer{position:absolute;inset:0;z-index:10;background:#00151488;backdrop-filter:blur(4px);display:flex;justify-content:flex-end}.drawer{width:min(87%,565px);background:#e9ebdf;color:#193627;padding:30px;overflow:auto;position:relative;animation:slide .45s cubic-bezier(.16,1,.3,1) both}.drawer-head{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:1px;margin-bottom:30px}.drawer-head button{font-size:20px;background:none;border:0;padding:5px}.drawer .kicker{color:#58725b}.drawer h2{font:italic 45px/1.03 Georgia,serif;letter-spacing:-2px;margin:17px 0 24px}.drawer p{font-size:13px;line-height:1.85;color:#435d42;margin:16px 0}.drawer h3{font-size:12px;font-weight:400;margin:27px 0 10px}.drawer .rule{border-top:1px solid #1a362933;padding-top:17px;margin-top:28px}.profile-picture{height:220px;position:relative;background:#193627;overflow:hidden}.profile-picture img{height:100%;width:100%;object-fit:cover;object-position:center 30%}.profile-picture.studio img{object-fit:contain;padding:45px}.drawer .profile-role{font-size:10px;color:#58725b;letter-spacing:.5px;margin-top:10px}.drawer .socials{margin-top:25px}.drawer .socials a{color:#193627}.drawer .profile-name{font-size:39px;margin-bottom:10px}.drawer .source-note{font-size:10px;color:#6c806a;margin-top:22px}.viewmsg{position:absolute;left:12px;bottom:12px;font-size:8px;padding:5px 8px;background:#001514d9}.wipe .picture{animation:shutter .5s cubic-bezier(.16,1,.3,1) both}@keyframes shutter{from{clip-path:inset(48% 0)}to{clip-path:inset(0)}}@keyframes slide{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:540px){.screen{padding:18px}.brand{opacity:1}.brand small{display:none}.layout{grid-template-columns:1fr;min-height:0;gap:30px;padding-top:25px}.cinema{transform:rotate(1deg)}.filmhead h1{font-size:56px}.picture{min-height:202px}.controlbar{width:95%;gap:6px;padding:8px 10px}.information{padding:25px;min-height:0}.tab-content{min-height:148px}.drawer{width:100%;padding:25px}.drawer h2{font-size:40px}.profile-picture{height:245px}.expanded .picture{height:420px}.expanded .filmhead{left:16px;right:16px}.expanded .filmhead h1{font-size:64px}.expanded .controlbar{width:95%}.foot{margin-top:25px}.layer{backdrop-filter:none}.faces{gap:10px}}
@media(hover:none){.brand{opacity:1}}@media(prefers-reduced-motion:reduce){.drawer,.wipe .picture{animation:none}*{transition:none!important}}
</style></head><body>
<nav class="review" aria-label="Review states"><button data-review="notes">Studio Notes</button><button data-review="brief">Expanded brief</button><button data-review="credits">Credits</button><button data-review="profile">Collaborator profile</button></nav>
<main id="mount"></main><p class="note">Design sample. Team photos and studio socials come from the site; this is not a confirmed film credit roster. Project copy is draft. Inline uses stills; the local HTML plays the supplied films.</p>
<script>
const root='../../../public/';
const films=[{name:'Nifemi',kind:'Full film',poster:root+'redesign/nifemi-poster.jpg',src:root+'redesign/nifemi.mp4'},{name:'Sharon',kind:'Excerpt',poster:root+'redesign/gallery-sharon.jpg',src:root+'redesign/gallery-sharon.mp4'}];
const people=[{id:'studio',name:'J StaR Films Studios',role:'Film and software studio',image:root+'redesign/studio-logo-white.png',links:[['YouTube','https://www.youtube.com/@JStaRFilms'],['Instagram','https://www.instagram.com/j_star.films/']]},{id:'john',name:'John Oluleke-Oke',role:'CEO / Chief Creative Director',image:root+'team/john-oluleke-oke.jpg',links:[]},{id:'nengi',name:'Nengimote Inala',role:'Head of Photography',image:root+'team/nengimote-inala.jpg',links:[]}];
let index=0,tab='story',demoPlaying=false,returnFocus=null,detail=null;const mount=document.getElementById('mount');
const story='A moment, seen differently.';
const brief='Keep the person at the centre. Let the setting support the story without taking it over. The camera should feel close enough to notice the small gestures, with enough space for the moment to breathe.';
function socials(){return '<div class="socials" aria-label="Example project posts"><button disabled>YouTube ↗</button><button disabled>TikTok ↗</button><button disabled>Instagram ↗</button></div>';}
function roster(){return '<div class="sample-label">Example collaborators</div><div class="people">'+people.map(p=>'<button class="person" data-person="'+p.id+'"><img src="'+p.image+'" alt=""><span><strong>'+p.name+'</strong><small>'+p.role+'</small></span><span class="arrow">↗</span></button>').join('')+'</div>';}
function content(){return tab==='story'?'<h2>'+story+'</h2><p>A short introduction to the people, occasion and idea behind the film.</p><button class="plain readmore" data-read="story">Read the story ↗</button>':tab==='brief'?'<h2>The original<br>idea.</h2><p class="clamp">'+brief+'</p><button class="plain readmore" data-read="brief">Read more ↗</button>':roster();}
function info(){return '<span class="kicker">A note from the studio</span><div class="tabbar" role="tablist" aria-label="Project information">'+['story','brief','credits'].map(t=>'<button id="tab-'+t+'" data-tab="'+t+'" role="tab" aria-selected="'+(t===tab)+'" aria-controls="tab-content" tabindex="'+(t===tab?0:-1)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div><div class="tab-content" id="tab-content" role="tabpanel" aria-labelledby="tab-'+tab+'">'+content()+'</div>'+socials()+'<div class="creditfoot"><div class="by">With</div><div class="faces"><button class="plain studio-link" data-person="studio">J StaR Films<br>Studios ↗</button>'+people.slice(1).map(p=>'<button class="avatar" data-person="'+p.id+'" aria-label="View '+p.name+' profile"><img src="'+p.image+'" alt=""></button>').join('')+'</div></div>';}
function destroy(){const v=mount.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load();}}
function render(){destroy();detail=null;demoPlaying=false;const p=films[index];mount.innerHTML='<section class="screen wipe"><div class="core"><header class="head"><span class="brand">J StaR<small>Films Studios</small></span><button class="plain" data-mode>Cinema view ↗</button></header><div class="layout"><div class="cinema"><div class="filmhead"><div><em>Now showing</em><h1>'+p.name+'.</h1></div><span class="count">0'+(index+1)+'</span></div><div class="picture"><img src="'+p.poster+'" alt="'+p.name+' film still"><button class="play" data-play aria-label="Play '+p.name+'">▶</button></div><div class="controlbar"><button data-play aria-label="Play film">▶</button><span class="time">--:--</span><input class="seek" aria-label="Seek video" type="range" value="0" min="0" max="100" disabled><button class="sound" data-mute aria-label="Mute video">Sound</button><button data-full aria-label="Fullscreen">⛶</button></div><div class="mediafoot"><span>'+p.kind.toUpperCase()+'</span><button class="plain" data-mode>Expand ↗</button></div></div><aside class="information" aria-label="Studio Notes">'+info()+'</aside></div><footer class="foot"><span>FILM / 0'+(index+1)+' OF 02</span><div class="arrows"><button data-prev '+(index===0?'disabled':'')+' aria-label="Previous project">←</button><span>'+p.name+'</span><button data-next '+(index===1?'disabled':'')+' aria-label="Next project">→</button></div></footer></div><div class="layer" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"></section></div></section>';}
function selectTab(t,focus=false){tab=t;mount.querySelectorAll('[data-tab]').forEach(b=>{const yes=b.dataset.tab===t;b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1;if(yes&&focus)b.focus();});const panel=mount.querySelector('#tab-content');panel.setAttribute('aria-labelledby','tab-'+t);panel.innerHTML=content();}
function openDetail(kind,id){returnFocus=document.activeElement;detail={kind,id};const drawer=mount.querySelector('.drawer');const head='<header class="drawer-head"><span>'+films[index].name.toUpperCase()+' / '+(kind==='profile'?'COLLABORATOR':'STUDIO NOTES')+'</span><button data-close aria-label="Close detail">×</button></header>';if(kind==='profile'){const p=people.find(x=>x.id===id);drawer.innerHTML=head+'<div class="profile-picture '+(id==='studio'?'studio':'')+'"><img src="'+p.image+'" alt="'+p.name+'"></div><div class="profile-role">'+p.role+'</div><h2 id="detail-title" class="profile-name">'+p.name+'.</h2>'+(p.links.length?'<div class="socials">'+p.links.map(([label,href])=>'<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+label+' ↗</a>').join('')+'</div>':'<p class="source-note">Personal social links await approval.</p>')+'<div class="rule"><span class="kicker">About this profile</span><p>Photo and role from the existing site. Participation in this film still needs confirmation.</p></div>';}else{drawer.innerHTML=head+'<span class="kicker">Draft layout copy</span><h2 id="detail-title">'+(id==='brief'?'The original idea.':story)+'</h2><p>'+brief+'</p><h3>The feeling</h3><p>Make room for stillness. Follow the pace of the person, not the pace of a template. Movement, colour and music should help tell the same story.</p><h3>The finish</h3><p>The edit should leave a clear memory of the person and the occasion. Keep the intention intact across the full piece and the shorter published versions.</p><div class="rule"><span class="kicker">The people behind it</span>'+roster()+'</div>';}drawer.scrollTop=0;mount.querySelector('.layer').hidden=false;mount.querySelector('.core').inert=true;drawer.querySelector('[data-close]').focus({preventScroll:true});}
function closeDetail(){if(!detail)return;detail=null;mount.querySelector('.layer').hidden=true;mount.querySelector('.core').inert=false;if(returnFocus?.isConnected&&!returnFocus.closest('.layer'))returnFocus.focus({preventScroll:true});else mount.querySelector('#tab-'+tab)?.focus({preventScroll:true});}
function setPlaying(value){mount.querySelector('.cinema')?.classList.toggle('playing',value);mount.querySelectorAll('[data-play]').forEach(b=>{b.textContent=value?'Ⅱ':'▶';b.setAttribute('aria-label',value?'Pause film':'Play film');});}
function time(t){return Number.isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'--:--';}
async function play(){if(window.__INLINE_REVIEW__){demoPlaying=!demoPlaying;setPlaying(demoPlaying);if(demoPlaying&&!mount.querySelector('.viewmsg'))mount.querySelector('.picture').insertAdjacentHTML('beforeend','<span class="viewmsg">PLAYBACK LAYOUT PREVIEW</span>');if(!demoPlaying)mount.querySelector('.viewmsg')?.remove();return;}let v=mount.querySelector('video');if(!v){v=document.createElement('video');v.src=films[index].src;v.poster=films[index].poster;v.playsInline=true;v.preload='none';v.setAttribute('aria-label',films[index].name+' '+films[index].kind);mount.querySelector('.picture img').replaceWith(v);for(const event of ['play','pause','ended'])v.addEventListener(event,()=>{if(v.isConnected)setPlaying(!v.paused);});v.addEventListener('timeupdate',()=>{if(!v.isConnected)return;mount.querySelector('.time').textContent=time(v.currentTime)+' / '+time(v.duration);const r=mount.querySelector('.seek');if(Number.isFinite(v.duration)&&v.duration>0){r.disabled=false;r.value=v.currentTime/v.duration*100;}});v.addEventListener('error',()=>{if(v.isConnected)mount.querySelector('.picture').innerHTML='<p style="padding:20px;font-size:12px">Video unavailable. Switch project and try again.</p>';});}if(v.paused)await v.play().catch(()=>{});else v.pause();}
document.addEventListener('click',e=>{if(e.target===mount.querySelector('.layer')){closeDetail();return;}const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.review){closeDetail();if(mount.querySelector('.screen').classList.contains('expanded'))mount.querySelector('[data-mode]').click();if(b.dataset.review==='notes'){selectTab('story');return;}if(b.dataset.review==='credits'){selectTab('credits');return;}if(b.dataset.review==='brief'){selectTab('brief');openDetail('text','brief');return;}selectTab('credits');openDetail('profile','john');return;}if(b.hasAttribute('data-close')){closeDetail();return;}if(b.dataset.person){openDetail('profile',b.dataset.person);return;}if(b.dataset.read){openDetail('text',b.dataset.read);return;}if(b.dataset.tab){selectTab(b.dataset.tab);return;}if(b.hasAttribute('data-mode')){const s=mount.querySelector('.screen');const expanded=s.classList.toggle('expanded');s.querySelector('.information').inert=expanded;mount.querySelectorAll('[data-mode]').forEach(x=>x.textContent=expanded?'Project info ↙':x.closest('.head')?'Cinema view ↗':'Expand ↗');return;}if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){index+=b.hasAttribute('data-next')?1:-1;const expanded=mount.querySelector('.screen').classList.contains('expanded');render();if(expanded)mount.querySelector('[data-mode]').click();return;}if(b.hasAttribute('data-play')){void play();return;}if(b.hasAttribute('data-mute')){const v=mount.querySelector('video');if(v){v.muted=!v.muted;b.textContent=v.muted?'Muted':'Sound';}else b.textContent=b.textContent==='Sound'?'Muted':'Sound';return;}if(b.hasAttribute('data-full')){const v=mount.querySelector('video');if(v){v.controls=true;v.requestFullscreen?.().catch(()=>{});}else mount.querySelector('.picture').requestFullscreen?.().catch(()=>{});}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){const v=mount.querySelector('video');if(v)v.controls=false;}});
document.addEventListener('input',e=>{if(e.target.matches('.seek')){const v=mount.querySelector('video');if(v&&Number.isFinite(v.duration))v.currentTime=e.target.value/100*v.duration;}});
document.addEventListener('keydown',e=>{if(detail){if(e.key==='Escape'){e.preventDefault();closeDetail();return;}if(e.key==='Tab'){const list=[...mount.querySelector('.drawer').querySelectorAll('button:not(:disabled),a[href]')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}const b=e.target.closest('[data-tab]');if(b&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['story','brief','credits'];selectTab(e.key==='Home'?'story':e.key==='End'?'credits':tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3],true);}if(e.key==='Escape'&&mount.querySelector('.screen').classList.contains('expanded'))mount.querySelector('[data-mode]').click();});
render();console.log('Studio Notes: tabs, expanded reading and collaborator profiles. Mock-up only.');
</script></body></html>
